            <div style={{fontWeight:600,fontSize:14,color:G.goldLight}}>🏪 Proveedores</div>
            <Btn size="sm" onClick={()=>{setSupForm(emptySupForm);setSupModal(true);}}>+ Nuevo</Btn>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
            {suppliers.length===0?<p style={{color:G.textMuted,fontSize:13}}>Sin proveedores registrados.</p>:suppliers.map(s=>(
              <div key={s.id} style={{background:"rgba(255,255,255,.03)",borderRadius:10,padding:"10px 14px",border:`1px solid ${G.cardBorder}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>🏪 {s.name}</div>
                    {s.phone&&<div style={{fontSize:11,color:G.textMuted,marginTop:2}}>📞 {s.phone}</div>}
                    {s.email&&<div style={{fontSize:11,color:G.textMuted,marginTop:2}}>✉️ {s.email}</div>}
                    {s.address&&<div style={{fontSize:11,color:G.textMuted,marginTop:2}}>📍 {s.address}</div>}
                    <div style={{fontSize:11,color:G.textMuted,marginTop:4}}>{restocks.filter(r=>r.supplierId===s.id).length} restock(s)</div>
                  </div>
                  <div style={{display:"flex",gap:4,marginLeft:6}}>
                    <Btn variant="edit" size="sm" onClick={e=>openEditSup(s,e)}>✏️</Btn>
                    <Btn variant="danger" size="sm" onClick={e=>{e.stopPropagation();setSupConfirmDel(s.id);}}>🗑️</Btn>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
        {[["🛒 Pedidos realizados",orders.length,G.goldLight],["📦 Unidades ingresadas",totalUnits,G.green],["💰 Total invertido",fmt$(totalInvested),G.red]].map(([l,v,c])=>(
          <Card key={l} style={{padding:"14px 16px"}}>
            <div style={{fontSize:11,color:G.textMuted,marginBottom:4}}>{l}</div>
            <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:c,fontWeight:600}}>{v}</div>
          </Card>
        ))}
      </div>

      {/* Barra de búsqueda */}
      <input placeholder="🔍 Buscar por ID, proveedor, fecha, producto o notas..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:16}}/>

      {orders.length===0?(
        <Card style={{textAlign:"center",padding:40}}>
          <div style={{fontSize:32,marginBottom:12}}>📦</div>
          <div style={{color:G.textMuted,fontSize:14}}>Aún no hay pedidos registrados.</div>
          <div style={{color:G.textMuted,fontSize:12,marginTop:6}}>Usa "Nuevo Pedido" para registrar tu primera entrada de mercancía.</div>
        </Card>
      ):filteredOrders.length===0?(
        <p style={{color:G.textMuted,fontSize:13,textAlign:"center",padding:20}}>No se encontraron pedidos con "{search}".</p>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {filteredOrders.map(order=>{
            const sup=suppliers.find(s=>s.id===order.supplierId);
            // Perfumes = solo costo base (sin extras distribuidos)
            const totalPerfumes=order.items.reduce((a,r)=>a+(parseFloat(r.costPrice||0)*(parseInt(r.qty)||0)),0);
            const totalQty=order.items.reduce((a,r)=>a+(parseInt(r.qty)||0),0);
            const ship=parseFloat(order.shippingCost||0);
            const mkt=parseFloat(order.marketingCost||0);
            const totalPedido=totalPerfumes+ship+mkt;
            return(
              <Card key={order.orderId}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
                      <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.goldLight}}>Pedido #{order.orderId.slice(-6).toUpperCase()}</div>
                      <div style={{fontSize:11,padding:"2px 8px",background:"rgba(201,168,76,.12)",borderRadius:20,color:G.gold,border:"1px solid rgba(201,168,76,.25)"}}>{fmtDate(order.date)}</div>
                    </div>
                    {sup&&<div style={{fontSize:13,color:G.blue}}>🏪 {sup.name}</div>}
                    {order.notes&&<div style={{fontSize:12,color:G.textMuted,marginTop:2}}>📝 {order.notes}</div>}
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap"}}>
                    <Btn variant="ghost" size="sm" onClick={()=>setDetailModal(order)}>📋 Detalle</Btn>
                    <Btn variant="edit" size="sm" onClick={()=>setEditModal(order)}>✏️ Editar</Btn>
                    <Btn variant="danger" size="sm" onClick={()=>setDeleteConfirm1(order)}>🗑️</Btn>
                  </div>
                </div>
                <div className="gold-line"/>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:10,fontSize:13}}>
                  <div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Productos</div>
                    <div style={{fontWeight:700,color:G.text}}>{order.items.length}</div>
                  </div>
                  <div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Unidades</div>
                    <div style={{fontWeight:700,color:G.green}}>{totalQty}</div>
                  </div>
                  <div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Perfumes</div>
                    <div style={{fontWeight:700,color:G.text}}>{fmt$(totalPerfumes)}</div>
                  </div>
                  {ship>0&&<div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Envío</div>
                    <div style={{fontWeight:700,color:G.gold}}>{fmt$(ship)}</div>
                  </div>}
                  {mkt>0&&<div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Marketing</div>
                    <div style={{fontWeight:700,color:G.blue}}>{fmt$(mkt)}</div>
                  </div>}
                  <div style={{background:"rgba(201,168,76,.06)",border:"1px solid rgba(201,168,76,.2)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Total pedido</div>
                    <div style={{fontWeight:700,color:G.gold,fontSize:15}}>{fmt$(totalPedido)}</div>
                  </div>
                </div>
                {order.attachments&&order.attachments.length>0&&(
                  <div style={{marginTop:10,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                    <span style={{fontSize:11,color:G.textMuted}}>📎</span>
                    {order.attachments.map((a,ai)=>(
                      a.url
                      ?<a key={ai} href={a.url} target="_blank" rel="noopener noreferrer" style={{height:36,padding:"0 10px",display:"flex",alignItems:"center",gap:5,background:"rgba(201,168,76,.08)",borderRadius:6,border:`1px solid ${G.cardBorder}`,fontSize:11,color:G.gold,textDecoration:"none"}}>📎 {a.name}</a>
                      :a.dataUrl&&a.type&&a.type.startsWith("image/")
                      ?<img key={ai} src={a.dataUrl} alt={a.name} onClick={()=>downloadReceipt(a.dataUrl,a.name)} style={{height:40,width:40,objectFit:"cover",borderRadius:5,cursor:"pointer",border:`1px solid ${G.cardBorder}`}} title={a.name}/>
                      :<div key={ai} onClick={()=>a.dataUrl&&downloadReceipt(a.dataUrl,a.name)} style={{height:40,padding:"0 8px",display:"flex",alignItems:"center",gap:4,background:"rgba(255,255,255,.05)",borderRadius:5,cursor:"pointer",border:`1px solid ${G.cardBorder}`,fontSize:11,color:G.textMuted}}>
                        📄 <span style={{maxWidth:70,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</span>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {/* Modal Nuevo Pedido */}
      {newModal&&<BulkRestockModal inventory={inventory} setInventory={setInventory} restocks={restocks} setRestocks={setRestocks} suppliers={suppliers} onClose={()=>setNewModal(false)}/>}

      {/* Modal Detalle */}
      {detailModal&&(()=>{
        const sup=suppliers.find(s=>s.id===detailModal.supplierId);
        const totalOrder=detailModal.items.reduce((a,r)=>a+parseFloat(r.totalPaid||0),0);
        return(
          <Modal title={`📋 Detalle Pedido #${detailModal.orderId.slice(-6).toUpperCase()}`} onClose={()=>setDetailModal(null)} wide>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12,fontSize:13}}>
              <span style={{color:G.textMuted}}>📅 {fmtDate(detailModal.date)}</span>
              {sup&&<span style={{color:G.blue}}>🏪 {sup.name}</span>}
              {detailModal.notes&&<span style={{color:G.textMuted}}>📝 {detailModal.notes}</span>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:400,overflowY:"auto"}}>
              {detailModal.items.map(r=>{
                const prod=inventory.find(p=>p.id===r.inventoryId);
                return(
                  <div key={r.id} style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:10,alignItems:"center",padding:"10px 12px",background:"rgba(255,255,255,.03)",borderRadius:8,fontSize:13}}>
                    <div>
                      <div style={{fontWeight:600}}>{prod?.name||"Producto eliminado"}</div>
                      <div style={{fontSize:11,color:G.textMuted}}>{prod?.brand}{prod?.size&&` · ${prod.size}`}</div>
                    </div>
                    <div style={{textAlign:"center"}}><div style={{fontSize:10,color:G.textMuted}}>Unidades</div><div style={{fontWeight:700,color:G.green}}>+{r.qty}</div></div>
                    <div style={{textAlign:"center"}}><div style={{fontSize:10,color:G.textMuted}}>Costo/u</div><div style={{fontWeight:600,color:G.text}}>{r.costPriceWithExtra?fmt$(r.costPriceWithExtra):r.costPrice?fmt$(r.costPrice):"—"}</div></div>
                    <div style={{textAlign:"right"}}><div style={{fontSize:10,color:G.textMuted}}>Total</div><div style={{fontWeight:700,color:G.gold}}>{fmt$(r.totalPaid||0)}</div></div>
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:12,display:"flex",justifyContent:"space-between",padding:"10px 12px",background:"rgba(201,168,76,.06)",border:"1px solid rgba(201,168,76,.2)",borderRadius:8,fontSize:14,fontWeight:600}}>
              <span style={{color:G.textMuted}}>Total perfumes</span><span style={{color:G.gold}}>{fmt$(totalOrder)}</span>
            </div>
            {parseFloat(detailModal.shippingCost||0)>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"6px 12px",fontSize:13}}><span style={{color:G.textMuted}}>+ Envío</span><span style={{color:G.gold}}>{fmt$(detailModal.shippingCost)}</span></div>}
            {parseFloat(detailModal.marketingCost||0)>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"6px 12px",fontSize:13}}><span style={{color:G.textMuted}}>+ Marketing</span><span style={{color:G.blue}}>{fmt$(detailModal.marketingCost)}</span></div>}
          </Modal>
        );
      })()}

      {/* Modal Editar */}
      {editModal&&<EditOrderModal order={editModal} inventory={inventory} setInventory={setInventory} restocks={restocks} setRestocks={setRestocks} suppliers={suppliers} onSave={saveEdit} onClose={()=>setEditModal(null)}/>}

      {/* Primera confirmación eliminar */}
      {deleteConfirm1&&(
        <Modal title="🗑️ Eliminar pedido" onClose={()=>setDeleteConfirm1(null)}>
          <div style={{padding:"14px",background:"rgba(224,92,92,.08)",border:"1px solid rgba(224,92,92,.3)",borderRadius:10,marginBottom:16}}>
            <div style={{fontWeight:600,color:G.red,marginBottom:8}}>¿Estás seguro que deseas eliminar este pedido?</div>
            <div style={{fontSize:13,color:G.textMuted}}>Pedido <strong style={{color:G.text}}>#{deleteConfirm1.orderId.slice(-6).toUpperCase()}</strong> del {fmtDate(deleteConfirm1.date)}</div>
            <div style={{fontSize:13,color:G.textMuted,marginTop:4}}>Esto revertirá el stock de <strong style={{color:G.text}}>{deleteConfirm1.items.reduce((a,r)=>a+(parseInt(r.qty)||0),0)} unidades</strong> en {deleteConfirm1.items.length} producto(s).</div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <Btn variant="ghost" onClick={()=>setDeleteConfirm1(null)} style={{flex:1}}>Cancelar</Btn>
            <Btn variant="danger" onClick={()=>{setDeleteConfirm2(deleteConfirm1);setDeleteConfirm1(null);}} style={{flex:1}}>Sí, continuar →</Btn>
          </div>
        </Modal>
      )}

      {/* Segunda confirmación eliminar */}
      {deleteConfirm2&&(
        <Modal title="⚠️ Confirmar eliminación" onClose={()=>setDeleteConfirm2(null)}>
          <div style={{padding:"14px",background:"rgba(224,92,92,.12)",border:"2px solid rgba(224,92,92,.5)",borderRadius:10,marginBottom:16,textAlign:"center"}}>
            <div style={{fontSize:28,marginBottom:8}}>⚠️</div>
            <div style={{fontWeight:700,color:G.red,fontSize:15,marginBottom:8}}>Esta acción NO se puede deshacer</div>
            <div style={{fontSize:13,color:G.textMuted}}>Se eliminarán permanentemente todos los registros de este pedido y se revertirá el stock del inventario.</div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <Btn variant="ghost" onClick={()=>setDeleteConfirm2(null)} style={{flex:1}}>No, cancelar</Btn>
            <Btn variant="danger" onClick={()=>doDeleteOrder(deleteConfirm2)} style={{flex:1,fontWeight:700}}>🗑️ Eliminar definitivamente</Btn>
          </div>
        </Modal>
      )}

      {/* Modales proveedores */}
      {supModal&&(
        <Modal title="Nuevo Proveedor" onClose={()=>setSupModal(false)}>
          <Field label="Nombre *"><input value={supForm.name} onChange={e=>setSupForm(f=>({...f,name:e.target.value}))} placeholder="Ej. Distribuidora XYZ"/></Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Teléfono"><input value={supForm.phone} onChange={e=>setSupForm(f=>({...f,phone:e.target.value}))} placeholder="+58 412..."/></Field>
            <Field label="Email"><input value={supForm.email} onChange={e=>setSupForm(f=>({...f,email:e.target.value}))} placeholder="correo@..."/></Field>
          </div>
          <Field label="Dirección"><input value={supForm.address} onChange={e=>setSupForm(f=>({...f,address:e.target.value}))} placeholder="Dirección..."/></Field>
          <Field label="Notas"><textarea value={supForm.notes} onChange={e=>setSupForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
          <Btn onClick={saveSup} style={{width:"100%"}}>Guardar Proveedor</Btn>
        </Modal>
      )}
      {supEditModal&&(
        <Modal title="Editar Proveedor" onClose={()=>{setSupEditModal(false);setSupEditId(null);}}>
          <Field label="Nombre *"><input value={supForm.name} onChange={e=>setSupForm(f=>({...f,name:e.target.value}))} placeholder="Ej. Distribuidora XYZ"/></Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Teléfono"><input value={supForm.phone} onChange={e=>setSupForm(f=>({...f,phone:e.target.value}))} placeholder="+58 412..."/></Field>
            <Field label="Email"><input value={supForm.email} onChange={e=>setSupForm(f=>({...f,email:e.target.value}))} placeholder="correo@..."/></Field>
          </div>
          <Field label="Dirección"><input value={supForm.address} onChange={e=>setSupForm(f=>({...f,address:e.target.value}))} placeholder="Dirección..."/></Field>
          <Field label="Notas"><textarea value={supForm.notes} onChange={e=>setSupForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
          <Btn onClick={saveEditSup} style={{width:"100%"}}>Guardar Cambios</Btn>
        </Modal>
      )}
      {supConfirmDel&&<ConfirmModal message="¿Eliminar este proveedor?" subtext="El proveedor será eliminado." onConfirm={doDeleteSup} onCancel={()=>setSupConfirmDel(null)}/>}
    </div>
  );
}

function EditOrderModal({order,inventory,setInventory,restocks,setRestocks,suppliers,onSave,onClose}){
  const[date,setDate]=useState(order.date||today());
  const[supplierId,setSupplierId]=useState(order.supplierId||"");
  const[notes,setNotes]=useState(order.notes||"");
  const[shippingCost,setShippingCost]=useState(order.shippingCost||"");
  const[marketingCost,setMarketingCost]=useState(order.marketingCost||"");
  const[attachments,setAttachments]=useState(order.attachments||[]);
  // Editar líneas: {id, inventoryId, qty, costPrice}
  const[lines,setLines]=useState(order.items.map(r=>({id:r.id,inventoryId:r.inventoryId,qty:String(r.qty||""),costPrice:String(r.costPrice||""),origQty:parseInt(r.qty)||0})));
  const fileRef=useRef();

  const[uploading,setUploading]=useState(false);
  const handleFiles=async(e)=>{
    const files=[...e.target.files];e.target.value="";
    if(!files.length)return;
    setUploading(true);
    for(const file of files){
      try{
        const result=await uploadToDrive(file);
        setAttachments(a=>[...a,{name:result.name,url:result.url,driveId:result.id}]);
      }catch(err){alert(`Error subiendo "${file.name}": ${err.message}`);}
    }
    setUploading(false);
  };
  const setLine=(id,field,val)=>setLines(ls=>ls.map(l=>l.id===id?{...l,[field]:val}:l));

  const shipNum=parseFloat(shippingCost||0);
  const mktNum=parseFloat(marketingCost||0);
  const totalUnitsNew=lines.reduce((a,l)=>a+(parseInt(l.qty)||0),0);
  const totalInvested=lines.reduce((a,l)=>a+(parseFloat(l.costPrice||0)*(parseInt(l.qty)||0)),0);
  const extraPerUnit=totalUnitsNew>0?(shipNum+mktNum)/totalUnitsNew:0;

  const doSave=async()=>{
    // Calcular diferencia de stock por producto
    let updatedInv=[...inventory];
    const updatedRestocks=restocks.map(r=>{
      if((r.orderId||r.id)!==order.orderId)return r;
      const line=lines.find(l=>l.id===r.id);
      if(!line)return r;
      const newQty=parseInt(line.qty)||0;
      const origQty=line.origQty;
      const diff=newQty-origQty;
      const costP=parseFloat(line.costPrice||0);
      const costWithExtra=(costP+extraPerUnit).toFixed(2);
      // Ajustar stock
      updatedInv=updatedInv.map(p=>p.id===r.inventoryId?{...p,stock:Math.max(0,(parseInt(p.stock)||0)+diff),...(line.costPrice?{costPrice:costWithExtra}:{})}:p);
      return{...r,qty:newQty,costPrice:line.costPrice||"",costPriceWithExtra:costWithExtra,extraCostPerUnit:extraPerUnit.toFixed(2),totalPaid:((costP+extraPerUnit)*newQty).toFixed(2),date,supplierId,notes,shippingCost,marketingCost,attachments};
    });
    setInventory(updatedInv);await saveData("inventory",updatedInv);
    setRestocks(updatedRestocks);await saveData("restocks",updatedRestocks);
    onClose();
  };

  return(
    <Modal title={`✏️ Editar Pedido #${order.orderId.slice(-6).toUpperCase()}`} onClose={onClose} wide>
      {/* Metadata */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"12px",marginBottom:10,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:11,fontWeight:600,color:G.goldLight,marginBottom:8,letterSpacing:1}}>INFORMACIÓN DEL PEDIDO</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="📅 Fecha"><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></Field>
          <Field label="🏪 Proveedor">
            <select value={supplierId} onChange={e=>setSupplierId(e.target.value)}>
              <option value="">— Sin especificar —</option>
              {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="🚚 Costo envío $"><input type="number" onWheel={e=>e.target.blur()} min="0" value={shippingCost} onChange={e=>setShippingCost(e.target.value)} placeholder="0.00"/></Field>
          <Field label="📣 Costo marketing $"><input type="number" onWheel={e=>e.target.blur()} min="0" value={marketingCost} onChange={e=>setMarketingCost(e.target.value)} placeholder="0.00"/></Field>
        </div>
        <Field label="📝 Notas"><textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2} placeholder="Notas..."/></Field>
      </div>

      {/* Líneas del pedido editables */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"12px",marginBottom:10,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:11,fontWeight:600,color:G.goldLight,marginBottom:8,letterSpacing:1}}>PRODUCTOS DEL PEDIDO</div>
        <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:280,overflowY:"auto"}}>
          {lines.map(l=>{
            const prod=inventory.find(p=>p.id===l.inventoryId);
            const newQty=parseInt(l.qty)||0;
            const diff=newQty-l.origQty;
            return(
              <div key={l.id} style={{padding:"10px 12px",borderRadius:8,border:`1px solid ${G.cardBorder}`,background:"rgba(255,255,255,.02)"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 80px 120px",gap:10,alignItems:"center"}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>{prod?.name||"Producto eliminado"}</div>
                    <div style={{fontSize:11,color:G.textMuted}}>{prod?.brand}{prod?.size&&` · ${prod.size}`}</div>
                    {diff!==0&&<div style={{fontSize:11,color:diff>0?G.green:G.red,marginTop:2}}>{diff>0?`+${diff}`:diff} unidades vs original</div>}
                  </div>
                  <div>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:3,textAlign:"center"}}>Unidades</div>
                    <input type="number" onWheel={e=>e.target.blur()} min="0" value={l.qty} onChange={e=>setLine(l.id,"qty",e.target.value)} onWheel={e=>e.target.blur()} style={{textAlign:"center",fontWeight:700,fontSize:14}}/>
                  </div>
                  <div>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:3,textAlign:"center"}}>Precio compra $</div>
                    <input type="number" onWheel={e=>e.target.blur()} min="0" value={l.costPrice} onChange={e=>setLine(l.id,"costPrice",e.target.value)} onWheel={e=>e.target.blur()} style={{textAlign:"center",fontSize:13}}/>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        {(shipNum>0||mktNum>0)&&totalUnitsNew>0&&(
          <div style={{fontSize:12,color:G.textMuted,marginTop:8,padding:"6px 8px",background:"rgba(201,168,76,.05)",borderRadius:6}}>
            Costos adicionales: <strong style={{color:G.gold}}>{fmt$(extraPerUnit)}/unidad</strong> · Total: <strong style={{color:G.green}}>{fmt$(totalInvested+shipNum+mktNum)}</strong>
          </div>
        )}
      </div>

      {/* Adjuntos */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"12px",marginBottom:10,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:11,fontWeight:600,color:G.goldLight,marginBottom:8,letterSpacing:1}}>📎 COMPROBANTES</div>
        <input ref={fileRef} type="file" accept="image/*,application/pdf" multiple onChange={handleFiles} style={{display:"none"}}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <Btn variant="ghost" size="sm" onClick={()=>fileRef.current.click()}>+ Subir archivo(s)</Btn>
          {attachments.map((a,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,.05)",border:`1px solid ${G.cardBorder}`,borderRadius:8,padding:"4px 10px",fontSize:12}}>
              <span>{a.type&&a.type.startsWith("image/")?"🖼️":"📄"}</span>
              <span style={{maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</span>
              <button onClick={()=>setAttachments(a=>a.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:G.red,cursor:"pointer",fontSize:14,padding:0}}>×</button>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:10}}>
        <Btn variant="ghost" onClick={onClose} style={{flex:1}}>Cancelar</Btn>
        <Btn onClick={doSave} style={{flex:2}}>💾 Guardar cambios</Btn>
      </div>
    </Modal>
  );
}

function BulkRestockModal({inventory,setInventory,restocks,setRestocks,suppliers,onClose}){
  const[date,setDate]=useState(today());
  const[supplierId,setSupplierId]=useState("");
  const[notes,setNotes]=useState("");
  const[shippingCost,setShippingCost]=useState("");
  const[marketingCost,setMarketingCost]=useState("");
  const[lines,setLines]=useState(inventory.map(p=>({inventoryId:p.id,qty:"",costPrice:p.costPrice||""})));
  const[search,setSearch]=useState("");
  const[attachments,setAttachments]=useState([]);
  const fileRef=useRef();

  const setLine=(id,field,val)=>setLines(ls=>ls.map(l=>l.inventoryId===id?{...l,[field]:val}:l));
  const[uploading,setUploading]=useState(false);
  const handleFiles=async(e)=>{
    const files=[...e.target.files];e.target.value="";
    if(!files.length)return;
    setUploading(true);
    for(const file of files){
      try{
        const result=await uploadToDrive(file);
        setAttachments(a=>[...a,{name:result.name,url:result.url,driveId:result.id}]);
      }catch(err){alert(`Error subiendo "${file.name}": ${err.message}`);}
    }
    setUploading(false);
  };

  const activeLines=lines.filter(l=>parseInt(l.qty)>0);
  const totalUnitsIn=activeLines.reduce((a,l)=>a+(parseInt(l.qty)||0),0);
  const totalInvested=activeLines.reduce((a,l)=>a+(parseFloat(l.costPrice||0)*(parseInt(l.qty)||0)),0);
  const shipNum=parseFloat(shippingCost||0);
  const mktNum=parseFloat(marketingCost||0);
  const extraPerUnit=totalUnitsIn>0?(shipNum+mktNum)/totalUnitsIn:0;
  const totalWithExtra=totalInvested+shipNum+mktNum;

  const doSave=async()=>{
    if(activeLines.length===0)return alert("Ingresa al menos una cantidad mayor a 0.");
    const orderId=uid();
    let updatedInv=[...inventory];
    const newRestocks=[];
    for(let i=0;i<activeLines.length;i++){
      const l=activeLines[i];
      const qty=parseInt(l.qty);
      const costP=parseFloat(l.costPrice||0);
      const costWithExtra=(costP+extraPerUnit).toFixed(2);
      updatedInv=updatedInv.map(p=>p.id===l.inventoryId?{...p,stock:(parseInt(p.stock)||0)+qty,...(l.costPrice?{costPrice:costWithExtra}:{})}:p);
      newRestocks.push({
        id:uid(),orderId,inventoryId:l.inventoryId,qty,
        costPrice:l.costPrice||"",costPriceWithExtra:costWithExtra,
        extraCostPerUnit:extraPerUnit.toFixed(2),
        totalPaid:((costP+extraPerUnit)*qty).toFixed(2),
        supplierId:supplierId||"",shippingCost,marketingCost,
        date,notes,
        // Adjuntos SOLO en la primera línea para no duplicar MBs en Firebase
        attachments:i===0?attachments:[],
        createdAt:now()
      });
    }
    setInventory(updatedInv);await saveData("inventory",updatedInv);
    const updatedR=[...restocks,...newRestocks];
    setRestocks(updatedR);await saveData("restocks",updatedR);
    onClose();
  };

  const filtered=inventory.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())||
    (p.brand&&p.brand.toLowerCase().includes(search.toLowerCase()))
  );

  return(
    <Modal title="📦 Nuevo Pedido" onClose={onClose} wide>
      {/* Sección 1: Info general */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"14px",marginBottom:12,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:12,fontWeight:600,color:G.goldLight,marginBottom:10,letterSpacing:1}}>INFORMACIÓN DEL PEDIDO</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="📅 Fecha de entrada"><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></Field>
          <Field label="🏪 Proveedor">
            <select value={supplierId} onChange={e=>setSupplierId(e.target.value)}>
              <option value="">— Sin especificar —</option>
              {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}{s.phone?` · ${s.phone}`:""}</option>)}
            </select>
          </Field>
        </div>
        <Field label="📝 Notas del pedido"><input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Ej. Pedido mensual de verano..."/></Field>
      </div>

      {/* Sección 2: Costos adicionales */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"14px",marginBottom:12,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:12,fontWeight:600,color:G.goldLight,marginBottom:10,letterSpacing:1}}>COSTOS ADICIONALES</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="🚚 Costo de envío $"><input type="number" onWheel={e=>e.target.blur()} min="0" value={shippingCost} onChange={e=>setShippingCost(e.target.value)} placeholder="0.00"/></Field>
          <Field label="📣 Costo de marketing $"><input type="number" onWheel={e=>e.target.blur()} min="0" value={marketingCost} onChange={e=>setMarketingCost(e.target.value)} placeholder="0.00"/></Field>
        </div>
        {(shipNum>0||mktNum>0)&&totalUnitsIn>0&&<div style={{fontSize:12,color:G.textMuted,marginTop:6,padding:"6px 8px",background:"rgba(201,168,76,.05)",borderRadius:6}}>
          Se distribuirán <strong style={{color:G.gold}}>{fmt$(extraPerUnit)}/unidad</strong> de costos adicionales.
        </div>}
      </div>

      {/* Sección 3: Productos */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"14px",marginBottom:12,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:12,fontWeight:600,color:G.goldLight,marginBottom:10,letterSpacing:1}}>PRODUCTOS A INGRESAR</div>
        <input placeholder="🔍 Filtrar productos..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:10}}/>
        <div style={{maxHeight:300,overflowY:"auto",display:"flex",flexDirection:"column",gap:6,paddingRight:4}}>
          {filtered.map(p=>{
            const line=lines.find(l=>l.inventoryId===p.id)||{qty:"",costPrice:""};
            const hasQty=parseInt(line.qty)>0;
            const costNum=parseFloat(line.costPrice||0);
            const finalCost=costNum+extraPerUnit;
            return(
              <div key={p.id} style={{padding:"10px 12px",borderRadius:8,border:`1px solid ${hasQty?G.gold:G.cardBorder}`,background:hasQty?"rgba(201,168,76,.04)":"rgba(255,255,255,.01)",transition:"all .15s"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 80px 120px",gap:10,alignItems:"center"}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
                    <div style={{fontSize:11,color:G.textMuted}}>{p.brand&&p.brand}{p.size&&` · ${p.size}`}
                      <span style={{marginLeft:8,color:hasQty?G.green:G.textMuted}}>Stock: {parseInt(p.stock)||0}{hasQty&&<span style={{color:G.green}}> → {(parseInt(p.stock)||0)+(parseInt(line.qty)||0)}</span>}</span>
                    </div>
                  </div>
                  <div>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:3,textAlign:"center"}}>Unidades</div>
                    <input type="number" onWheel={e=>e.target.blur()} min="0" placeholder="0" value={line.qty} onChange={e=>setLine(p.id,"qty",e.target.value)} onWheel={e=>e.target.blur()} style={{textAlign:"center",fontWeight:700,fontSize:15,color:hasQty?G.green:G.text}}/>
                  </div>
                  <div>
                    <div style={{fontSize:10,color:G.textMuted,marginBottom:3,textAlign:"center"}}>Precio compra $</div>
                    <input type="number" onWheel={e=>e.target.blur()} min="0" placeholder={p.costPrice||"0.00"} value={line.costPrice} onChange={e=>setLine(p.id,"costPrice",e.target.value)} onWheel={e=>e.target.blur()} style={{textAlign:"center",fontSize:13}}/>
                  </div>
                </div>
                {hasQty&&(shipNum>0||mktNum>0)&&(
                  <div style={{marginTop:6,display:"flex",gap:10,fontSize:11,padding:"4px 8px",background:"rgba(255,255,255,.03)",borderRadius:5}}>
                    <span style={{color:G.textMuted}}>Perfume: <strong style={{color:G.text}}>{fmt$(costNum)}</strong></span>
                    <span style={{color:G.textMuted}}>+ Extras: <strong style={{color:G.gold}}>{fmt$(extraPerUnit)}</strong></span>
                    <span style={{color:G.textMuted}}>= <strong style={{color:G.green}}>{fmt$(finalCost)}/u</strong></span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Resumen total */}
      {totalUnitsIn>0&&(
        <div style={{padding:"12px 14px",background:"rgba(76,175,125,.07)",border:"1px solid rgba(76,175,125,.25)",borderRadius:10,marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:600,color:G.green,marginBottom:8}}>RESUMEN DEL PEDIDO</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8,fontSize:13}}>
            <div><span style={{color:G.textMuted}}>Unidades: </span><strong style={{color:G.green}}>{totalUnitsIn}</strong></div>
            <div><span style={{color:G.textMuted}}>Perfumes: </span><strong>{fmt$(totalInvested)}</strong></div>
            {shipNum>0&&<div><span style={{color:G.textMuted}}>Envío: </span><strong style={{color:G.gold}}>{fmt$(shipNum)}</strong></div>}
            {mktNum>0&&<div><span style={{color:G.textMuted}}>Marketing: </span><strong style={{color:G.blue}}>{fmt$(mktNum)}</strong></div>}
            <div><span style={{color:G.textMuted}}>Total: </span><strong style={{color:G.green,fontSize:15}}>{fmt$(totalWithExtra)}</strong></div>
          </div>
        </div>
      )}

      {/* Sección 4: Adjuntos */}
      <div style={{background:"rgba(255,255,255,.02)",borderRadius:10,padding:"14px",marginBottom:12,border:`1px solid ${G.cardBorder}`}}>
        <div style={{fontSize:12,fontWeight:600,color:G.goldLight,marginBottom:6,letterSpacing:1}}>📎 COMPROBANTES</div>
        {!getGoogleToken&&false&&<div/>}
        <input ref={fileRef} type="file" accept="image/*,application/pdf" multiple onChange={handleFiles} style={{display:"none"}}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <Btn variant="ghost" size="sm" onClick={()=>fileRef.current.click()} disabled={uploading}>
            {uploading?"⏳ Subiendo...":"+ Subir bauche(s)"}
          </Btn>
          {attachments.map((a,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,.05)",border:`1px solid ${G.cardBorder}`,borderRadius:8,padding:"4px 10px",fontSize:12}}>
              <span>{a.url?"☁️":a.type&&a.type.startsWith("image/")?"🖼️":"📄"}</span>
              {a.url
                ?<a href={a.url} target="_blank" rel="noopener noreferrer" style={{maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:G.gold,textDecoration:"none"}}>{a.name}</a>
                :<span style={{maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</span>
              }
              <button onClick={()=>setAttachments(at=>at.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:G.red,cursor:"pointer",fontSize:14,padding:0}}>×</button>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:10}}>
        <Btn variant="ghost" onClick={onClose} style={{flex:1}}>Cancelar</Btn>
        <Btn onClick={doSave} disabled={totalUnitsIn===0} style={{flex:2,opacity:totalUnitsIn===0?.5:1}}>
          ✅ Registrar pedido — {totalUnitsIn} unidad(es) · {fmt$(totalWithExtra)}
        </Btn>
      </div>
    </Modal>
  );
}

// ─── EXPORTAR ─────────────────────────────────────────────────────────────────
function Exportar({clients,sales,payments,inventory}){
  const exportExcel=()=>{
    const wb=XLSX.utils.book_new();
    const clientData=clients.map(c=>({"Nombre":c.name,"CI":c.ci||"","Teléfono":c.phone||"","Dirección":c.address||"","Notas":c.notes||"","Registro":c.createdAt}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(clientData.length?clientData:[{}]),"Clientes");
    const salesData=sales.map(s=>{const bal=calcSaleBalance(s,payments);const client=clients.find(c=>c.id===s.clientId);return{"Cliente":client?.name||"","CI":client?.ci||"","Perfume":s.perfume,"Total $":parseFloat(s.total),"Pagado $":bal.paid,"Restante $":bal.remaining,"Estado":bal.status,"Fecha":s.date,"Notas":s.notes||""};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(salesData.length?salesData:[{}]),"Ventas");
    const payData=payments.map(p=>{const client=clients.find(c=>c.id===p.clientId);const sale=sales.find(s=>s.id===p.saleId);return{"Cliente":client?.name||"","CI":client?.ci||"","Perfume":sale?.perfume||"","Monto $":parseFloat(p.amount),"Fecha":p.date,"Tipo":p.isInitial?"Pago inicial":"Abono","Notas":p.notes||""};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(payData.length?payData:[{}]),"Abonos");
    const invData=inventory.map(p=>({"Producto":p.name,"Marca":p.brand||"","Tamaño":p.size||"","Stock":parseInt(p.stock)||0,"Stock mínimo":p.minStock!==''&&p.minStock!=null?parseInt(p.minStock):2,"Costo $":parseFloat(p.costPrice||0),"Precio venta $":parseFloat(p.salePrice||0),"Ganancia $":parseFloat(p.salePrice||0)-parseFloat(p.costPrice||0),"Notas":p.notes||""}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(invData.length?invData:[{}]),"Inventario");
    const totalDebt=sales.reduce((a,s)=>a+calcSaleBalance(s,payments).remaining,0);
    const totalCollected=payments.reduce((a,p)=>a+parseFloat(p.amount||0),0);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{"Concepto":"Total Clientes","Valor":clients.length},{"Concepto":"Total Ventas","Valor":sales.length},{"Concepto":"Total Cobrado $","Valor":totalCollected},{"Concepto":"Total por Cobrar $","Valor":totalDebt},{"Concepto":"Productos en inventario","Valor":inventory.length},{"Concepto":"Exportado el","Valor":new Date().toLocaleString("es-ES")}]),"Resumen");
    XLSX.writeFile(wb,`PerSenso_${today()}.xlsx`);
  };
  const totalDebt=sales.reduce((a,s)=>a+calcSaleBalance(s,payments).remaining,0);
  const totalCollected=payments.reduce((a,p)=>a+parseFloat(p.amount||0),0);
  return(
    <div className="fade-in">
      <div style={{fontFamily:"Cormorant Garamond",fontSize:28,color:G.goldLight,marginBottom:4}}>Exportar Datos</div>
      <div style={{color:G.textMuted,fontSize:13,marginBottom:24}}>Descarga un archivo Excel con toda la información</div>
      <Card style={{maxWidth:480,marginBottom:20}}>
        <div style={{fontFamily:"Cormorant Garamond",fontSize:20,color:G.gold,marginBottom:16}}>📊 Resumen a Exportar</div>
        {[["Clientes",clients.length],["Ventas registradas",sales.length],["Abonos registrados",payments.length],["Productos en inventario",inventory.length],["Total cobrado",fmt$(totalCollected)],["Total por cobrar",fmt$(totalDebt)]].map(([k,v])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${G.cardBorder}`,fontSize:14}}><span style={{color:G.textMuted}}>{k}</span><span style={{fontWeight:600}}>{v}</span></div>
        ))}
        <Btn onClick={exportExcel} style={{width:"100%",marginTop:20}}>⬇️ Descargar Excel (.xlsx)</Btn>
      </Card>
    </div>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[error,setError]=useState("");
  const[loading,setLoading]=useState(false);
  const btnRef=useRef();

  useEffect(()=>{
    const init=()=>{
      if(!window.google)return setTimeout(init,300);
      window.google.accounts.id.initialize({
        client_id:GOOGLE_CLIENT_ID,
        callback:handleCredential,
        auto_select:false,
      });
      window.google.accounts.id.renderButton(btnRef.current,{
        theme:"filled_black",size:"large",shape:"pill",
        text:"signin_with",logo_alignment:"center",width:280,
      });
    };
    init();
  },[]);

  const handleCredential=async(response)=>{
    setLoading(true);setError("");
    try{
      const payload=JSON.parse(atob(response.credential.split(".")[1]));
      const email=payload.email.toLowerCase();
      const name=payload.name||email;
      if(!ALLOWED_EMAILS.includes(email)){
        setError(`❌ ${email} no tiene acceso a PerSenso.`);
        setLoading(false);return;
      }
      _googleUser={email,name};
      onLogin(name);
    }catch(e){
      setError("Error al iniciar sesión. Intenta de nuevo.");
      setLoading(false);
    }
  };

  return(
    <div style={{minHeight:"100vh",background:"#0d0d0f",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div className="fade-in" style={{width:"100%",maxWidth:380,background:"#16161a",border:"1px solid #2a2a32",borderRadius:20,padding:"40px 32px"}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:42,color:"#e8c97a",fontStyle:"italic",letterSpacing:2}}>✦ PerSenso</div>
          <div style={{fontSize:12,color:"#888",marginTop:6,letterSpacing:1}}>GESTIÓN DE PERFUMERÍA</div>
        </div>
        <div style={{textAlign:"center",marginBottom:20,fontSize:13,color:"#888"}}>Inicia sesión con tu cuenta de Google autorizada</div>
        {error&&<div style={{background:"rgba(224,92,92,.12)",border:"1px solid rgba(224,92,92,.3)",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#e05c5c",textAlign:"center"}}>{error}</div>}
        {loading
          ?<div style={{textAlign:"center",color:"#888",fontSize:13,padding:20}}>Conectando...</div>
          :<div style={{display:"flex",justifyContent:"center",minHeight:44}} ref={btnRef}/>
        }
        <div style={{textAlign:"center",marginTop:24,fontSize:11,color:"#333"}}>Solo cuentas autorizadas pueden acceder</div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App(){
  const[loggedIn,setLoggedIn]=useState(false);
  const[userName,setUserName]=useState("");
  const handleLogin=(name)=>{setLoggedIn(true);setUserName(name||"");};
  const handleLogout=()=>{clearGoogleSession();setLoggedIn(false);setUserName("");};
  const[tab,setTab]=useState("dashboard");
  const[clients,setClients]=useState([]);
  const[sales,setSales]=useState([]);
  const[payments,setPayments]=useState([]);
  const[inventory,setInventory]=useState([]);
  const[suppliers,setSuppliers]=useState([]);
  const[restocks,setRestocks]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    const load=async()=>{
      if(_saving)return;
      try{
        const[c,s,p,inv,sup,rst]=await Promise.all([fbGet("clients"),fbGet("sales"),fbGet("payments"),fbGet("inventory"),fbGet("suppliers"),fbGet("restocks")]);
        if(_saving)return;
        const saleIds=new Set(s.map(sale=>sale.id));
        const cleanP=p.filter(pay=>saleIds.has(pay.saleId));
        if(cleanP.length!==p.length)await saveData("payments",cleanP);

        // Limpiar adjuntos duplicados: solo la primera línea de cada pedido los guarda
        const byOrder={};
        let needsClean=false;
        const cleanRst=rst.map(r=>{
          const oid=r.orderId||r.id;
          if(!byOrder[oid]){byOrder[oid]=true;return r;} // primera línea: ok
          if(r.attachments&&r.attachments.length>0){needsClean=true;return{...r,attachments:[]};}
          return r;
        });
        if(needsClean){await saveData("restocks",cleanRst);setRestocks(cleanRst);}
        else setRestocks(rst);

        setClients(c);setSales(s);setPayments(cleanP);setInventory(inv);setSuppliers(sup);
      }catch(e){console.error("Load error:",e);}
      setLoading(false);
    };
    load();
    const iv=setInterval(load,5000);
    return()=>clearInterval(iv);
  },[]);

  if(!loggedIn)return <Login onLogin={handleLogin}/>;
  if(loading)return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,background:"#0d0d0f"}}>
      <div style={{fontFamily:"Cormorant Garamond",fontSize:36,color:"#e8c97a"}}>✦ PerSenso</div>
      <div style={{color:"#888",fontSize:13}}>Conectando con Firebase...</div>
    </div>
  );

  const lowStockCount=inventory.filter(p=>(parseInt(p.stock)||0)<=(p.minStock!==''&&p.minStock!=null?parseInt(p.minStock):2)).length;
  const tabs=[
    {id:"dashboard",icon:"◈",label:"Inicio"},
    {id:"clientes",icon:"👥",label:"Clientes"},
    {id:"ventas",icon:"🌸",label:"Ventas"},
    {id:"abonos",icon:"💳",label:"Abonos"},
    {id:"inventario",icon:"📦",label:"Inventario",badge:lowStockCount},
    {id:"pedidos",icon:"🛒",label:"Pedidos"},
    {id:"exportar",icon:"📤",label:"Exportar"},
  ];

  return(
    <div style={{minHeight:"100vh",paddingBottom:80}}>
      <div style={{background:G.card,borderBottom:`1px solid ${G.cardBorder}`,padding:"14px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10}}>
        <div style={{fontFamily:"Cormorant Garamond",fontSize:22,color:G.goldLight,fontStyle:"italic"}}>✦ PerSenso</div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:11,padding:"4px 10px",background:"rgba(76,175,125,.1)",borderRadius:20,border:"1px solid rgba(76,175,125,.2)",color:G.green}}>● Firebase · 5s</div>
          {userName&&<div style={{fontSize:11,color:"#888",padding:"4px 10px",background:"rgba(255,255,255,.04)",borderRadius:20,border:`1px solid ${G.cardBorder}`}}>👤 {userName.split(" ")[0]}</div>}
          <button onClick={handleLogout} style={{background:"rgba(224,92,92,.12)",border:"1px solid rgba(224,92,92,.25)",borderRadius:8,color:"#e05c5c",fontSize:12,padding:"5px 10px",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>🚪 Salir</button>
        </div>
      </div>
      <div style={{display:"flex",gap:4,padding:"12px 20px",borderBottom:`1px solid ${G.cardBorder}`,flexWrap:"wrap"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?`linear-gradient(135deg,${G.goldDark},${G.gold})`:"transparent",color:tab===t.id?"#0d0d0f":G.textMuted,border:tab===t.id?"none":`1px solid ${G.cardBorder}`,borderRadius:8,padding:"7px 16px",fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:6,transition:"all .2s",position:"relative"}}>
            <span>{t.icon}</span><span>{t.label}</span>
            {t.badge>0&&<span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:16,height:16,borderRadius:8,background:G.red,color:"#fff",fontSize:10,fontWeight:700,padding:"0 4px",marginLeft:2}}>{t.badge}</span>}
          </button>
        ))}
      </div>
      <div style={{maxWidth:960,margin:"0 auto",padding:"24px 16px"}}>
        {tab==="dashboard"&&<Inicio clients={clients} sales={sales} payments={payments} inventory={inventory}/>}
        {tab==="clientes"&&<Clientes clients={clients} setClients={setClients} sales={sales} payments={payments} inventory={inventory} suppliers={suppliers}/>}
        {tab==="ventas"&&<Ventas clients={clients} sales={sales} setSales={setSales} payments={payments} setPayments={setPayments} inventory={inventory} setInventory={setInventory} suppliers={suppliers}/>}
        {tab==="abonos"&&<Abonos clients={clients} sales={sales} payments={payments} setPayments={setPayments} inventory={inventory} suppliers={suppliers}/>}
        {tab==="inventario"&&<Inventario inventory={inventory} setInventory={setInventory} suppliers={suppliers} restocks={restocks} setRestocks={setRestocks}/>}
        {tab==="pedidos"&&<Pedidos inventory={inventory} setInventory={setInventory} suppliers={suppliers} setSuppliers={setSuppliers} restocks={restocks} setRestocks={setRestocks}/>}
        {tab==="exportar"&&<Exportar clients={clients} sales={sales} payments={payments} inventory={inventory}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
