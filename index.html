function b64url(str){
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
function b64urlU8(arr){
  let s='';for(const b of arr)s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function getSAToken(){
  const now=Math.floor(Date.now()/1000);
  if(_saToken&&now<_saTokenExp-60)return _saToken;
  // Parsear PEM
  const pem=SA_KEY.replace(/-----[^-]+-----/g,'').replace(/\s/g,'');
  const der=Uint8Array.from(atob(pem),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('pkcs8',der,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
  // Crear JWT
  const header=b64url(JSON.stringify({alg:'RS256',typ:'JWT'}));
  const claim=b64url(JSON.stringify({iss:SA_EMAIL,scope:'https://www.googleapis.com/auth/drive.file',aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now}));
  const sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,new TextEncoder().encode(`${header}.${claim}`));
  const jwt=`${header}.${claim}.${b64urlU8(new Uint8Array(sig))}`;
  // Intercambiar por token
  const res=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`});
  const data=await res.json();
  if(!data.access_token)throw new Error('No se pudo obtener token de Drive');
  _saToken=data.access_token;
  _saTokenExp=now+3600;
  return _saToken;
}

async function uploadToDrive(file){
  const token=await getSAToken();
  const metadata={name:`${Date.now()}_${file.name}`,parents:[DRIVE_FOLDER_ID]};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
  form.append('file',file);
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',{method:'POST',headers:{Authorization:`Bearer ${token}`},body:form});
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Error subiendo a Drive');}
  const d=await res.json();
  // Hacer público para ver con link
  await fetch(`https://www.googleapis.com/drive/v3/files/${d.id}/permissions`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
  return{id:d.id,name:file.name,url:d.webViewLink};
}

function calcSaleBalance(sale,payments){
  const paid=payments.filter(p=>p.saleId===sale.id).reduce((s,p)=>s+parseFloat(p.amount||0),0);
  const total=parseFloat(sale.total||0);
  const remaining=total-paid;
  return{paid,remaining:Math.max(0,remaining),status:remaining<=0?"pagado":paid>0?"parcial":"pendiente"};
}

function filterByRange(items,dateFrom,dateTo,dateField="date"){
  if(!dateFrom&&!dateTo)return items;
  return items.filter(i=>{
    const raw=i[dateField]||i.createdAt; if(!raw)return false;
    const d=raw.slice(0,10);
    if(dateFrom&&d<dateFrom)return false;
    if(dateTo&&d>dateTo)return false;
    return true;
  });
}

function DateRangeFilter({dateFrom,dateTo,onChange}){
  const setPreset=(days)=>{if(days===null){onChange("","");return;}const to=today();const from=new Date();from.setDate(from.getDate()-days);onChange(from.toISOString().split("T")[0],to);};
  const hasFilter=dateFrom||dateTo;
  const presets=[{l:"Hoy",d:0},{l:"7 días",d:7},{l:"30 días",d:30},{l:"90 días",d:90},{l:"6 meses",d:180},{l:"1 año",d:365}];
  return(
    <div style={{marginBottom:20,padding:"14px 16px",background:"rgba(201,168,76,.05)",borderRadius:12,border:"1px solid rgba(201,168,76,.15)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:12}}>

      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        {presets.map(p=><button key={p.d} onClick={()=>setPreset(p.d)} style={{fontSize:12,padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"DM Sans,sans-serif",fontWeight:500,background:"rgba(255,255,255,.05)",color:G.textMuted,transition:"all .2s"}} onMouseEnter={e=>e.target.style.background="rgba(201,168,76,.2)"} onMouseLeave={e=>e.target.style.background="rgba(255,255,255,.05)"}>{p.l}</button>)}
      </div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{flex:"1 1 140px"}}><label style={{fontSize:11,color:G.textMuted,display:"block",marginBottom:4}}>Desde</label><input type="date" value={dateFrom} onChange={e=>onChange(e.target.value,dateTo)} style={{padding:"7px 12px",fontSize:13}}/></div>

    </div>
  );
}

function ClienteSearch({clients,value,onChange,placeholder="Buscar por nombre o CI..."}){
  const[query,setQuery]=useState("");const[open,setOpen]=useState(false);const wrapRef=useRef();
  useEffect(()=>{if(value){const c=clients.find(c=>c.id===value);if(c)setQuery(c.name+(c.ci?` — ${c.ci}`:""));}else setQuery("");},[value,clients]);
  useEffect(()=>{const h=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
  const filtered=clients.filter(c=>c.name.toLowerCase().includes(query.toLowerCase())||(c.ci&&c.ci.toLowerCase().includes(query.toLowerCase())));
  return(
    <div ref={wrapRef} style={{position:"relative"}}>
      <input value={query} onChange={e=>{setQuery(e.target.value);setOpen(true);if(!e.target.value)onChange("");}} onFocus={()=>setOpen(true)} placeholder={placeholder}/>
      {open&&filtered.length>0&&<div className="dropdown-list" onMouseDown={e=>e.stopPropagation()}>{filtered.map(c=><div key={c.id} className="dropdown-item" onMouseDown={e=>{e.preventDefault();onChange(c.id);setQuery(c.name+(c.ci?` — ${c.ci}`:""));setOpen(false);}}><span style={{fontWeight:500}}>{c.name}</span>{c.ci&&<span style={{color:G.textMuted,marginLeft:8,fontSize:12}}>CI: {c.ci}</span>}{c.phone&&<span style={{color:G.textMuted,marginLeft:8,fontSize:12}}>📞 {c.phone}</span>}</div>)}</div>}

}

// ─── SVG BAR CHART ────────────────────────────────────────────────────────────
function BarChart({data,color=G.gold,height=160,label=""}){
  if(!data||data.length===0)return <div style={{color:G.textMuted,fontSize:13,padding:20,textAlign:"center"}}>Sin datos suficientes</div>;
  const maxVal=Math.max(...data.map(d=>d.v),1);
  const W=56; const GAP=8; const totalW=data.length*(W+GAP);
  const barH=h=>Math.max(2,(h/maxVal)*(height-40));
  return(
    <div style={{overflowX:"auto"}}>
      <svg width={Math.max(totalW+20,300)} height={height+30} style={{display:"block"}}>
        {data.map((d,i)=>{
          const x=10+i*(W+GAP); const bh=barH(d.v); const y=height-bh-20;
          return(
            <g key={i}>
              <rect x={x} y={y} width={W} height={bh} rx={5} fill={color} opacity={0.85}/>
              <text x={x+W/2} y={height-4} textAnchor="middle" fontSize={10} fill={G.textMuted}>{d.l}</text>
              {d.v>0&&<text x={x+W/2} y={y-4} textAnchor="middle" fontSize={10} fill={G.goldLight}>{d.v>999?`${(d.v/1000).toFixed(1)}k`:d.v}</text>}
            </g>
          );
        })}
        <line x1={10} y1={height-20} x2={Math.max(totalW+10,290)} y2={height-20} stroke={G.cardBorder} strokeWidth={1}/>
      </svg>
    </div>
  );
}

  const totalDebt=fSales.reduce((a,s)=>a+calcSaleBalance(s,payments).remaining,0);
  const totalCollected=fPayments.reduce((a,p)=>a+parseFloat(p.amount||0),0);
  const totalFacturado=fSales.reduce((a,s)=>a+parseFloat(s.total||0),0);
  const enriched=fSales.map(s=>({...s,...calcSaleBalance(s,payments)}));
  const pending=enriched.filter(s=>s.status!=="pagado");
  const recentPayments=[...fPayments].sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date)).slice(0,5);

  const months=useMemo(()=>{
    const arr=[];for(let i=7;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);arr.push({key:d.toISOString().slice(0,7),label:fmtMonth(d.toISOString().slice(0,7)+"-01")});}
    return arr;
  },[]);
  const ventasPorMes=months.map(m=>({l:m.label,v:sales.filter(s=>s.date&&s.date.slice(0,7)===m.key).length}));
  const cobradoPorMes=months.map(m=>({l:m.label,v:Math.round(payments.filter(p=>p.date&&p.date.slice(0,7)===m.key).reduce((a,p)=>a+parseFloat(p.amount||0),0))}));
  const clientesPorMes=months.map(m=>({l:m.label,v:clients.filter(c=>c.createdAt&&c.createdAt.slice(0,7)===m.key).length}));
  const chartData=chartType==="ventas"?ventasPorMes:chartType==="cobrado"?cobradoPorMes:clientesPorMes;
  const chartColor=chartType==="cobrado"?G.green:chartType==="clientes"?G.blue:G.gold;

  // Top Perfumes: agrupa por inventoryId cuando existe, luego por nombre normalizado
  const perfumeCount={};
  sales.forEach(s=>{
    if(!s.perfume)return;
    // Si tiene inventoryId, usar el nombre del producto del inventario como clave canónica
    const invItem=s.inventoryId?inventory.find(p=>p.id===s.inventoryId):null;
    const key=invItem
      ?`${invItem.name}${invItem.brand?" · "+invItem.brand:""}${invItem.size?" "+invItem.size:""}`
      :s.perfume.trim().toLowerCase().replace(/\s+/g," ");
    const label=invItem?`${invItem.name}${invItem.brand?" · "+invItem.brand:""}${invItem.size?" "+invItem.size:""}`:s.perfume;
    if(!perfumeCount[key])perfumeCount[key]={label,cnt:0};
    perfumeCount[key].cnt++;
  });
  const topPerfumes=Object.values(perfumeCount).sort((a,b)=>b.cnt-a.cnt).slice(0,5);
  const clientPaid={};
  payments.forEach(p=>{if(p.clientId)clientPaid[p.clientId]=(clientPaid[p.clientId]||0)+parseFloat(p.amount||0);});
  const topClientes=Object.entries(clientPaid).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,amt])=>({id,name:clients.find(c=>c.id===id)?.name||"—",amt}));

  const dist={pagado:enriched.filter(s=>s.status==="pagado").length,parcial:enriched.filter(s=>s.status==="parcial").length,pendiente:enriched.filter(s=>s.status==="pendiente").length};
  const distTotal=dist.pagado+dist.parcial+dist.pendiente||1;

  const StatCard=({label,value,sub,color})=>(
    <Card><div style={{fontSize:12,color:G.textMuted,marginBottom:6}}>{label}</div><div style={{fontFamily:"Cormorant Garamond",fontSize:30,color:color||G.goldLight,fontWeight:600}}>{value}</div>{sub&&<div style={{fontSize:12,color:G.textMuted,marginTop:4}}>{sub}</div>}</Card>
  );
  const PctBar=({pct,color})=>(
    <div style={{flex:1,height:8,background:"rgba(255,255,255,.07)",borderRadius:4,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:4,transition:"width .6s"}}/>
    </div>
  );

  return(
    <div className="fade-in">
      <div style={{fontFamily:"Cormorant Garamond",fontSize:28,color:G.goldLight,marginBottom:4}}>✦ Inicio</div>
      <div style={{color:G.textMuted,fontSize:13,marginBottom:16}}>Vista general de tu perfumería</div>
      <DateRangeFilter dateFrom={dateFrom} dateTo={dateTo} onChange={handleRange}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(148px,1fr))",gap:12,marginBottom:20}}>
        <StatCard label="💰 Facturado" value={fmt$(totalFacturado)} sub={hasFilter?"en período":"total"} color={G.goldLight}/>
        <StatCard label="✅ Cobrado" value={fmt$(totalCollected)} sub={hasFilter?"en período":"total"} color={G.green}/>
        <StatCard label="💸 Por cobrar" value={fmt$(totalDebt)} sub={`${pending.length} venta(s)`} color={G.red}/>
        <StatCard label="👥 Clientes" value={fClients.length} sub={hasFilter?"en período":"registrados"} color={G.blue}/>
        <StatCard label="📦 Ventas" value={fSales.length} sub={hasFilter?"en período":"totales"}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:20}}>
        <Card>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.goldLight,marginBottom:14}}>Deudas Pendientes</div>
          {pending.length===0?<p style={{color:G.textMuted,fontSize:13}}>¡Todo al día! 🎉</p>:pending.slice(0,6).map(s=>{
            const client=clients.find(c=>c.id===s.clientId);
            return<div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${G.cardBorder}`}}>
              <div><div style={{fontSize:13,fontWeight:500}}>{client?.name||"Cliente"}</div><div style={{fontSize:11,color:G.textMuted}}>{s.perfume}</div></div>
              <div style={{textAlign:"right"}}><div style={{color:G.red,fontWeight:600}}>{fmt$(s.remaining)}</div><Badge status={s.status}/></div>
            </div>;
          })}
        </Card>
        <Card>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.goldLight,marginBottom:14}}>Últimos Abonos</div>
          {recentPayments.length===0?<p style={{color:G.textMuted,fontSize:13}}>Sin abonos aún.</p>:recentPayments.map(p=>{
            const client=clients.find(c=>c.id===p.clientId);
            const sale=sales.find(s=>s.id===p.saleId);
            return<div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${G.cardBorder}`}}>
              <div>
                <div style={{fontSize:13,fontWeight:500}}>{client?.name||"—"}</div>
                {sale&&<div style={{fontSize:11,color:G.gold}}>🌸 {sale.perfume}</div>}
                <div style={{fontSize:11,color:G.textMuted}}>{fmtDate(p.date)}</div>
              </div>
              <div style={{color:G.green,fontWeight:600,flexShrink:0,marginLeft:8}}>{fmt$(p.amount)}</div>
            </div>;
          })}
        </Card>
      </div>
      <Card style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:20,color:G.goldLight}}>Tendencia — Últimos 8 meses</div>
          <div style={{display:"flex",gap:6}}>
            {[["ventas","📦 Ventas",G.gold],["cobrado","💵 Cobrado",G.green],["clientes","👥 Clientes",G.blue]].map(([k,l,c])=>(
              <button key={k} onClick={()=>setChartType(k)} style={{fontSize:12,padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"DM Sans,sans-serif",fontWeight:500,background:chartType===k?c:"rgba(255,255,255,.05)",color:chartType===k?"#0d0d0f":G.textMuted,transition:"all .2s"}}>{l}</button>
            ))}
          </div>
        </div>
        <BarChart data={chartData} color={chartColor} height={160}/>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.goldLight}}>Estado de Ventas {hasFilter&&<span style={{fontSize:12,color:G.textMuted,fontFamily:"DM Sans"}}>· período</span>}</div>
            <button onClick={()=>setSalesView(v=>v==="pct"?"$":"pct")} style={{fontSize:11,padding:"3px 10px",borderRadius:20,border:`1px solid ${G.cardBorder}`,background:"rgba(255,255,255,.04)",color:G.textMuted,cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>{salesView==="pct"?"Ver en $":"Ver en %"}</button>
          </div>
          {fSales.length===0?<p style={{color:G.textMuted,fontSize:13}}>Sin ventas en este período.</p>:(
            <>{[["✅ Pagadas",dist.pagado,G.green,enriched.filter(s=>s.status==="pagado").reduce((a,s)=>a+s.paid,0)],["⚡ Parciales",dist.parcial,G.gold,enriched.filter(s=>s.status==="parcial").reduce((a,s)=>a+s.remaining,0)],["❌ Pendientes",dist.pendiente,G.red,enriched.filter(s=>s.status==="pendiente").reduce((a,s)=>a+s.remaining,0)]].map(([l,n,c,amount])=>(
              <div key={l} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:13}}>
                  <span style={{color:G.textMuted}}>{l}</span>
                  <span style={{color:c,fontWeight:600}}>{salesView==="pct"?`${n} (${Math.round(n/distTotal*100)}%)`:fmt$(amount)}</span>
                </div>
                <PctBar pct={n/distTotal*100} color={c}/>
              </div>
            ))}</>
          )}
        </Card>
        <Card>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.goldLight,marginBottom:16}}>🌸 Top Perfumes</div>
          {topPerfumes.length===0?<p style={{color:G.textMuted,fontSize:13}}>Sin datos aún.</p>:topPerfumes.map(({label,cnt},i)=>(
            <div key={label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:`1px solid ${G.cardBorder}`,fontSize:13}}>
              <span><span style={{color:G.goldDark,fontWeight:700,marginRight:8}}>#{i+1}</span>{label}</span>
              <span style={{color:G.gold,fontWeight:600}}>{cnt} venta{cnt!==1?"s":""}</span>
            </div>
          ))}
        </Card>
      </div>
      <Card>
        <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.goldLight,marginBottom:16}}>🏆 Top Clientes por Monto Pagado</div>
        {topClientes.length===0?<p style={{color:G.textMuted,fontSize:13}}>Sin datos aún.</p>:(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10}}>
            {topClientes.map(({id,name,amt},i)=>(
              <div key={name} onClick={()=>{const c=clients.find(x=>x.id===id);if(c)setClientModal(c);}} style={{background:"rgba(255,255,255,.03)",borderRadius:10,padding:"12px 14px",border:`1px solid ${G.cardBorder}`,cursor:"pointer",transition:"border-color .2s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor=G.gold} onMouseLeave={e=>e.currentTarget.style.borderColor=G.cardBorder}>
                <div style={{fontSize:11,color:G.goldDark,marginBottom:4}}>#{i+1}</div>
                <div style={{fontWeight:600,fontSize:14,marginBottom:4}}>{name}</div>
                <div style={{color:G.green,fontWeight:700,fontSize:18}}>{fmt$(amt)}</div>
                <div style={{fontSize:10,color:G.textMuted,marginTop:4}}>Ver detalle →</div>
              </div>
            ))}
          </div>
        )}
      </Card>

      {/* Modal detalle cliente */}
      {clientModal&&(()=>{
        const cSales=sales.filter(s=>s.clientId===clientModal.id);
        const cPaid=payments.filter(p=>p.clientId===clientModal.id).reduce((a,p)=>a+parseFloat(p.amount||0),0);
        const cDebt=cSales.reduce((a,s)=>a+calcSaleBalance(s,payments).remaining,0);
        return(
          <Modal title={`👤 ${clientModal.name}`} onClose={()=>setClientModal(null)}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              <div style={{background:"rgba(76,175,125,.08)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:10,color:G.textMuted}}>Total pagado</div>
                <div style={{fontFamily:"Cormorant Garamond",fontSize:22,color:G.green,fontWeight:600}}>{fmt$(cPaid)}</div>
              </div>
              <div style={{background:"rgba(224,92,92,.08)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:10,color:G.textMuted}}>Por cobrar</div>
                <div style={{fontFamily:"Cormorant Garamond",fontSize:22,color:G.red,fontWeight:600}}>{fmt$(cDebt)}</div>
              </div>
            </div>
            {clientModal.phone&&<div style={{fontSize:13,color:G.textMuted,marginBottom:6}}>📞 {clientModal.phone}</div>}
            {clientModal.ci&&<div style={{fontSize:13,color:G.textMuted,marginBottom:6}}>🪪 {clientModal.ci}</div>}
            {clientModal.address&&<div style={{fontSize:13,color:G.textMuted,marginBottom:10}}>📍 {clientModal.address}</div>}
            <div style={{fontWeight:600,fontSize:13,marginBottom:8,color:G.goldLight}}>Compras ({cSales.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:220,overflowY:"auto"}}>
              {cSales.length===0?<p style={{color:G.textMuted,fontSize:13}}>Sin compras.</p>:cSales.map(s=>{
                const bal=calcSaleBalance(s,payments);
                return<div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",background:"rgba(255,255,255,.03)",borderRadius:8,fontSize:13}}>
                  <div><div style={{fontWeight:500}}>{s.perfume}</div><div style={{fontSize:11,color:G.textMuted}}>{fmtDate(s.date)}</div></div>
                  <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}><div style={{fontWeight:600,color:G.gold}}>{fmt$(s.total)}</div><Badge status={bal.status}/></div>
                </div>;
              })}
            </div>
          </Modal>
        );
      })()}
    </div>
  );
}
// ─── CLIENTES ─────────────────────────────────────────────────────────────────
function Clientes({clients,setClients,sales,payments,inventory,suppliers}){
  const emptyForm={name:"",ci:"",phone:"",address:"",notes:"",createdAt:today()};
  const[modal,setModal]=useState(false);const[editModal,setEditModal]=useState(false);const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(emptyForm);const[search,setSearch]=useState("");const[sort,setSort]=useState("alfa");
  const[detail,setDetail]=useState(null);const[confirmDel,setConfirmDel]=useState(null);
  const save=async()=>{if(!form.name.trim())return;const updated=[...clients,{...form,id:uid()}];setClients(updated);await saveData("clients",updated);setForm(emptyForm);setModal(false);};
  const saveEdit=async()=>{if(!form.name.trim())return;const updated=clients.map(c=>c.id===editId?{...c,...form}:c);setClients(updated);await saveData("clients",updated);if(detail?.id===editId)setDetail(updated.find(c=>c.id===editId));setEditModal(false);setEditId(null);setForm(emptyForm);};
  const openEdit=(c,e)=>{e.stopPropagation();setEditId(c.id);setForm({name:c.name,ci:c.ci||"",phone:c.phone||"",address:c.address||"",notes:c.notes||"",createdAt:c.createdAt||today()});setEditModal(true);};
  const doDelete=async()=>{const updated=clients.filter(c=>c.id!==confirmDel);setClients(updated);await saveData("clients",updated);if(detail?.id===confirmDel)setDetail(null);setConfirmDel(null);};
  let filtered=clients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||(c.ci&&c.ci.toLowerCase().includes(search.toLowerCase()))||(c.phone&&c.phone.includes(search)));
  if(sort==="alfa")filtered=[...filtered].sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==="compras")filtered=[...filtered].sort((a,b)=>sales.filter(s=>s.clientId===b.id).length-sales.filter(s=>s.clientId===a.id).length);
  else if(sort==="pagado")filtered=[...filtered].sort((a,b)=>{const pA=payments.filter(p=>p.clientId===a.id).reduce((s,p)=>s+parseFloat(p.amount||0),0);const pB=payments.filter(p=>p.clientId===b.id).reduce((s,p)=>s+parseFloat(p.amount||0),0);return pB-pA;});
  const CFields=()=>(
    <>
      <Field label="Nombre *"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ej. María López"/></Field>
      <Field label="CI (Cédula)"><input value={form.ci} onChange={e=>setForm(f=>({...f,ci:e.target.value}))} placeholder="Ej. V-12345678"/></Field>
      <Field label="Teléfono"><input value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="+58 412 000 0000"/></Field>
      <Field label="Dirección"><input value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="Ej. Av. Principal, Casa #5"/></Field>
      <Field label="📅 Fecha de registro"><input type="date" value={form.createdAt||today()} onChange={e=>setForm(f=>({...f,createdAt:e.target.value}))}/></Field>
      <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
    </>
  );
  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:20}}>
        <div><div style={{fontFamily:"Cormorant Garamond",fontSize:28,color:G.goldLight}}>Clientes</div><div style={{color:G.textMuted,fontSize:13}}>{clients.length} cliente(s) registrado(s)</div></div>
        <Btn onClick={()=>{setForm(emptyForm);setModal(true);}}>+ Nuevo Cliente</Btn>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <input placeholder="🔍 Buscar por nombre, CI o teléfono..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:"1 1 200px",maxWidth:340}}/>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{flex:"0 0 auto",width:"auto",paddingRight:28}}>
          <option value="alfa">A → Z</option>
          <option value="compras">Mayor cantidad de compras</option>
          <option value="pagado">Mayor monto pagado</option>
        </select>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
        {filtered.map(c=>{
          const cs=sales.filter(s=>s.clientId===c.id);const debt=cs.reduce((a,s)=>a+calcSaleBalance(s,payments).remaining,0);const totalPaid=payments.filter(p=>p.clientId===c.id).reduce((a,p)=>a+parseFloat(p.amount||0),0);
          return(
            <Card key={c.id} onClick={()=>setDetail(c)} style={{cursor:"pointer",borderColor:debt>0?"rgba(224,92,92,.3)":G.cardBorder}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{width:40,height:40,borderRadius:"50%",background:`linear-gradient(135deg,${G.goldDark},${G.gold})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:"#0d0d0f",fontSize:16}}>{c.name[0].toUpperCase()}</div>
                <div style={{display:"flex",gap:6}}><Btn variant="edit" size="sm" onClick={e=>openEdit(c,e)}>✏️</Btn><Btn variant="danger" size="sm" onClick={e=>{e.stopPropagation();setConfirmDel(c.id);}}>🗑️</Btn></div>
              </div>
              <div style={{fontWeight:600,marginTop:10,fontSize:15}}>{c.name}</div>
              {c.ci&&<div style={{fontSize:12,color:G.textMuted,marginTop:2}}>🪪 CI: {c.ci}</div>}
              {c.phone&&<div style={{fontSize:12,color:G.textMuted,marginTop:2}}>📞 {c.phone}</div>}
              {c.address&&<div style={{fontSize:12,color:G.textMuted,marginTop:2}}>📍 {c.address}</div>}
              <div className="gold-line"/>
              <div style={{fontSize:12,color:G.textMuted}}>{cs.length} compra(s) · {fmt$(totalPaid)} pagado</div>
              <div style={{fontSize:12,marginTop:4}}>{debt>0?<span style={{color:G.red,fontWeight:600}}>Debe: {fmt$(debt)}</span>:<span style={{color:G.green}}>Al día ✓</span>}</div>
            </Card>
          );
        })}
        {filtered.length===0&&<p style={{color:G.textMuted,fontSize:13}}>Sin clientes que coincidan.</p>}
      </div>
      {modal&&<Modal title="Nuevo Cliente" onClose={()=>setModal(false)}><CFields/><Btn onClick={save} style={{width:"100%"}}>Guardar Cliente</Btn></Modal>}
      {editModal&&<Modal title="Editar Cliente" onClose={()=>{setEditModal(false);setEditId(null);}}><CFields/><Btn onClick={saveEdit} style={{width:"100%"}}>Guardar Cambios</Btn></Modal>}
      {confirmDel&&<ConfirmModal message="¿Eliminar este cliente?" subtext="El cliente será eliminado. Su historial se mantendrá." onConfirm={doDelete} onCancel={()=>setConfirmDel(null)}/>}
      {detail&&(
        <Modal title={detail.name} onClose={()=>setDetail(null)}>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:16,padding:"12px 14px",background:"rgba(255,255,255,.03)",borderRadius:10}}>
            {detail.ci&&<div style={{fontSize:13}}>🪪 CI: <strong>{detail.ci}</strong></div>}
            {detail.phone&&<div style={{fontSize:13}}>📞 <strong>{detail.phone}</strong></div>}
            {detail.address&&<div style={{fontSize:13}}>📍 <strong>{detail.address}</strong></div>}
            {detail.createdAt&&<div style={{fontSize:13}}>📅 Desde: <strong>{fmtDate(detail.createdAt)}</strong></div>}
          </div>
          {detail.notes&&<p style={{fontSize:13,color:G.textMuted,marginBottom:16}}>{detail.notes}</p>}
          <div style={{fontWeight:600,marginBottom:10,color:G.gold}}>Historial de Compras</div>
          {sales.filter(s=>s.clientId===detail.id).map(s=>{
            const bal=calcSaleBalance(s,payments);
            const invItem=inventory?.find(p=>p.id===s.inventoryId);
            const supplier=invItem&&suppliers?.find(sup=>sup.id===invItem.supplierId);
            return<div key={s.id} style={{padding:"10px 0",borderBottom:`1px solid ${G.cardBorder}`}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:500}}>🌸 {s.perfume}</span><Badge status={bal.status}/></div>
              {supplier&&<div style={{fontSize:11,color:G.blue,marginTop:2}}>🏪 {supplier.name}{supplier.phone&&` · ${supplier.phone}`}</div>}
              <div style={{fontSize:12,color:G.textMuted,marginTop:4}}>{fmtDate(s.date)} · Total: {fmt$(s.total)} · Pagado: <span style={{color:G.green}}>{fmt$(bal.paid)}</span> · Resta: <span style={{color:bal.remaining>0?G.red:G.green}}>{fmt$(bal.remaining)}</span></div>
              {payments.filter(p=>p.saleId===s.id).map(p=><div key={p.id} style={{fontSize:12,color:G.textMuted,marginLeft:12,marginTop:4}}>└ {p.isInitial?"⭐ Pago inicial":`Abono ${fmtDate(p.date)}`}: <span style={{color:G.green}}>{fmt$(p.amount)}</span><ReceiptLink receipt={p.receipt}/></div>)}
            </div>;
          })}
          {sales.filter(s=>s.clientId===detail.id).length===0&&<p style={{color:G.textMuted,fontSize:13}}>Sin compras registradas.</p>}
        </Modal>
      )}
    </div>
  );
}

// ─── VENTAS ───────────────────────────────────────────────────────────────────
function Ventas({clients,sales,setSales,payments,setPayments,inventory,setInventory,suppliers}){
  const emptyForm={clientId:"",perfume:"",total:"",initialPayment:"",date:today(),notes:"",receipt:"",inventoryId:""};
  const[modal,setModal]=useState(false);const[editModal,setEditModal]=useState(false);const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(emptyForm);const[imgPreview,setImgPreview]=useState(null);

  const pickFromInventory=(item)=>{
    setForm(f=>({...f,perfume:`${item.name}${item.size?" "+item.size:""}`,total:item.salePrice||"",inventoryId:item.id}));
    setInvSearch("");
  };

  const save=async()=>{
    if(!form.clientId||!form.perfume||!form.total)return alert("Completa: Cliente, Perfume y Total.");
    const saleId=uid();const updatedSales=[...sales,{...form,id:saleId}];setSales(updatedSales);await saveData("sales",updatedSales);
    if(form.initialPayment&&parseFloat(form.initialPayment)>0){const ip={id:uid(),saleId,clientId:form.clientId,amount:form.initialPayment,date:form.date,notes:"Pago inicial",isInitial:true,receipt:form.receipt,createdAt:now()};const up=[...payments,ip];setPayments(up);await saveData("payments",up);}
    // Descontar stock si se seleccionó producto del inventario
    if(form.inventoryId){
      const updatedInv=inventory.map(p=>p.id===form.inventoryId?{...p,stock:Math.max(0,(parseInt(p.stock)||0)-1)}:p);
      setInventory(updatedInv);await saveData("inventory",updatedInv);
    }
    setForm(emptyForm);setImgPreview(null);setModal(false);setInvMode(false);
  };
  const openEdit=(s,e)=>{e.stopPropagation();setEditId(s.id);setForm({clientId:s.clientId,perfume:s.perfume,total:s.total,initialPayment:"",date:s.date,notes:s.notes||"",receipt:s.receipt||"",inventoryId:s.inventoryId||""});setImgPreview(s.receipt||null);setInvMode(false);setInvSearch("");setEditModal(true);};
  const saveEdit=async()=>{if(!form.perfume||!form.total)return alert("Completa Perfume y Total.");const updated=sales.map(s=>s.id===editId?{...s,perfume:form.perfume,total:form.total,date:form.date,notes:form.notes,receipt:form.receipt}:s);setSales(updated);await saveData("sales",updated);setEditModal(false);setEditId(null);setForm(emptyForm);setImgPreview(null);};
  const doDelete=async()=>{
    const saleToDelete=sales.find(s=>s.id===confirmDel);
    const updatedSales=sales.filter(s=>s.id!==confirmDel);
    const updatedPayments=payments.filter(p=>p.saleId!==confirmDel);
    setSales(updatedSales);await saveData("sales",updatedSales);
    setPayments(updatedPayments);await saveData("payments",updatedPayments);
    // Devolver stock si la venta estaba vinculada a un producto del inventario
    if(saleToDelete?.inventoryId){
      const updatedInv=inventory.map(p=>p.id===saleToDelete.inventoryId?{...p,stock:(parseInt(p.stock)||0)+1}:p);
      setInventory(updatedInv);await saveData("inventory",updatedInv);
    }
    setConfirmDel(null);
  };

  const enriched=sales.map(s=>({...s,...calcSaleBalance(s,payments),client:clients.find(c=>c.id===s.clientId)}));
  let filtered2=filter==="todos"?enriched:enriched.filter(s=>s.status===filter);
  if(search.trim()){const q=search.toLowerCase();filtered2=filtered2.filter(s=>s.client?.name.toLowerCase().includes(q)||(s.client?.ci&&s.client.ci.toLowerCase().includes(q))||(s.client?.phone&&s.client.phone.includes(q))||s.perfume.toLowerCase().includes(q));}

            {payments.filter(p=>p.saleId===s.id).map(p=><div key={p.id} style={{fontSize:12,color:G.textMuted,marginTop:6,paddingLeft:8,borderLeft:`2px solid ${G.goldDark}`}}>{p.isInitial?"⭐ Pago inicial":`Abono ${fmtDate(p.date)}`}: <span style={{color:G.green,fontWeight:600}}>{fmt$(p.amount)}</span><ReceiptLink receipt={p.receipt}/>{!p.isInitial&&p.notes&&<span> · {p.notes}</span>}</div>)}
            {s.receipt&&payments.filter(p=>p.saleId===s.id&&p.isInitial).length===0&&<div style={{fontSize:12,color:G.textMuted,marginTop:6,paddingLeft:8,borderLeft:`2px solid ${G.goldDark}`}}>📎 Comprobante: <ReceiptLink receipt={s.receipt} label="Descargar"/></div>}
          </Card>
        ))}
        {sorted.length===0&&<p style={{color:G.textMuted,fontSize:13}}>Sin ventas en esta categoría.</p>}
      </div>
      {confirmDel&&<ConfirmModal message="¿Eliminar esta venta?" subtext="Se eliminará la venta y todos sus abonos relacionados." onConfirm={doDelete} onCancel={()=>setConfirmDel(null)}/>}
      {detailClient&&<Modal title={detailClient.name} onClose={()=>setDetailClient(null)}><div style={{display:"flex",flexDirection:"column",gap:10}}>{detailClient.ci&&<div style={{fontSize:14}}>🪪 CI: <strong>{detailClient.ci}</strong></div>}{detailClient.phone&&<div style={{fontSize:14}}>📞 Teléfono: <strong>{detailClient.phone}</strong></div>}{detailClient.address&&<div style={{fontSize:14}}>📍 Dirección: <strong>{detailClient.address}</strong></div>}{detailClient.notes&&<div style={{fontSize:13,color:G.textMuted,marginTop:4}}>{detailClient.notes}</div>}</div></Modal>}
      {modal&&(
        <Modal title="Nueva Venta a Crédito" onClose={()=>{setModal(false);setInvMode(false);setInvSearch("");}} wide>
          {/* 1. Cliente */}

          {/* 2. Inventario */}
          {inventory.length>0&&(
            <div style={{marginBottom:14,background:"rgba(255,255,255,.02)",borderRadius:10,border:`1px solid ${invMode?G.gold:G.cardBorder}`,padding:12,transition:"border-color .2s"}}>

          {/* Selector de inventario */}

                        <div style={{color:G.gold,fontWeight:600,fontSize:13}}>{item.salePrice?fmt$(item.salePrice):""}</div>
                      </div>
                    ))}
                    {invFiltered.length===0&&<div style={{color:G.textMuted,fontSize:13,textAlign:"center",padding:10}}>Sin productos</div>}
                  </div>

              )}
            </div>
          )}
          <Field label="Total $ * (editable)">
            <input type="number" onWheel={e=>e.target.blur()} value={form.total} onChange={e=>setForm({...form,total:e.target.value})} placeholder="0.00"/>
            <div style={{fontSize:11,color:G.textMuted,marginTop:3}}>💡 Edita si aplicaste un descuento</div>
          </Field>
          <Field label="Fecha de Venta"><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
          <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={2} placeholder="Notas..."/></Field>
          <Field label="📎 Comprobante">

            <div style={{display:"flex",gap:10,alignItems:"center"}}>

            </div>
          </Field>
          <Btn onClick={saveEdit} style={{width:"100%"}}>Guardar Cambios</Btn>
        </Modal>
      )}
    </div>
  );
}

    <div className="fade-in">

        <div style={{marginBottom:28}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.gold}}>⚠ Pendiente de Cobro</div>
            <input placeholder="🔍 Buscar..." value={pendSearch} onChange={e=>setPendSearch(e.target.value)} style={{maxWidth:280,fontSize:13,padding:"7px 12px"}}/>
          </div>
          <div style={{maxHeight:520,overflowY:"auto",paddingRight:4}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:10}}>
              {displayPending.map(s=>(
                <Card key={s.id} style={{borderColor:s.status==="parcial"?"rgba(201,168,76,.4)":"rgba(224,92,92,.4)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div><div style={{fontWeight:600,fontSize:14}}>{s.client?.name||"—"}</div>{s.client?.ci&&<div style={{fontSize:11,color:G.textMuted}}>🪪 {s.client.ci}</div>}{s.client?.phone&&<div style={{fontSize:11,color:G.textMuted}}>📞 {s.client.phone}</div>}</div>
                    {s.client&&<Btn variant="ghost" size="sm" onClick={()=>setDetailClient(s.client)} style={{fontSize:11,padding:"3px 8px"}}>Ver más</Btn>}
                  </div>
                  <div className="gold-line"/>
                  <div style={{fontSize:13,color:G.gold,marginBottom:6}}>🌸 {s.perfume}</div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span style={{color:G.textMuted}}>Resta:</span><span style={{color:G.red,fontWeight:700}}>{fmt$(s.remaining)}</span></div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:G.textMuted,marginTop:2}}><span>Pagado: {fmt$(s.paid)}</span><span>Total: {fmt$(s.total)}</span></div>
                  <div style={{marginTop:8,background:"#1e1e24",borderRadius:4,height:4}}><div style={{width:`${Math.min(100,(s.paid/Math.max(s.total,1))*100)}%`,height:"100%",background:`linear-gradient(90deg,${G.goldDark},${G.gold})`,borderRadius:4}}/></div>
                  {payments.filter(p=>p.saleId===s.id).length>0&&<div style={{marginTop:10,paddingTop:8,borderTop:`1px solid ${G.cardBorder}`}}>{payments.filter(p=>p.saleId===s.id).map(p=><div key={p.id} style={{fontSize:11,color:G.textMuted,paddingLeft:8,borderLeft:`2px solid ${G.goldDark}`,marginBottom:4}}>{p.isInitial?"⭐ Pago inicial":`Abono ${fmtDate(p.date)}`}: <span style={{color:G.green,fontWeight:600}}>{fmt$(p.amount)}</span><ReceiptLink receipt={p.receipt} label="📎 Ver"/>{p.notes&&!p.isInitial&&<span style={{marginLeft:4}}>· {p.notes}</span>}</div>)}</div>}
                  <Btn variant="success" size="sm" style={{width:"100%",marginTop:10}} onClick={()=>{setForm(f=>({...f,saleId:s.id}));setSaleSearch(s.client?.name||"");setModal(true);}}>💳 Abonar</Btn>
                </Card>
              ))}
              {displayPending.length===0&&<p style={{color:G.textMuted,fontSize:13}}>Sin resultados.</p>}
            </div>
          </div>
        </div>
      )}
      <div style={{fontFamily:"Cormorant Garamond",fontSize:18,color:G.gold,marginBottom:12}}>Historial de Abonos <span style={{fontSize:13,color:G.textMuted,fontFamily:"DM Sans"}}>({history.length})</span></div>
      <div style={{maxHeight:500,overflowY:"auto",paddingRight:4,display:"flex",flexDirection:"column",gap:8}}>
        {history.map(p=>(
          <Card key={p.id} style={{padding:"12px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontWeight:500}}>{p.client?.name||"—"}</div>
                <div style={{fontSize:12,color:G.textMuted}}>🌸 {p.sale?.perfume||"Venta eliminada"} · {fmtDate(p.date)}{p.isInitial&&<span style={{color:G.gold,marginLeft:6}}>⭐ Pago inicial</span>}</div>
                {!p.isInitial&&p.notes&&<div style={{fontSize:12,color:G.textMuted}}>{p.notes}</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                {p.receipt&&<img src={p.receipt} alt="comprobante" onClick={()=>downloadReceipt(p.receipt)} title="Clic para descargar" style={{width:40,height:40,objectFit:"cover",borderRadius:6,border:`1px solid ${G.cardBorder}`,cursor:"pointer"}}/>}
                <span style={{color:G.green,fontWeight:700,fontSize:18}}>{fmt$(p.amount)}</span>
              </div>
            </div>
          </Card>
        ))}
        {history.length===0&&<p style={{color:G.textMuted,fontSize:13}}>Sin abonos registrados aún.</p>}
      </div>
      {detailClient&&<Modal title={detailClient.name} onClose={()=>setDetailClient(null)}><div style={{display:"flex",flexDirection:"column",gap:10}}>{detailClient.ci&&<div style={{fontSize:14}}>🪪 CI: <strong>{detailClient.ci}</strong></div>}{detailClient.phone&&<div style={{fontSize:14}}>📞 <strong>{detailClient.phone}</strong></div>}{detailClient.address&&<div style={{fontSize:14}}>📍 <strong>{detailClient.address}</strong></div>}</div></Modal>}
      {modal&&(
        <Modal title="Registrar Abono" onClose={()=>{setModal(false);setImgPreview(null);setSaleSearch("");}} wide>
          <Field label="🔍 Buscar venta (nombre, CI o perfume)"><input value={saleSearch} onChange={e=>{setSaleSearch(e.target.value);setForm(f=>({...f,saleId:""}));}} placeholder="Escribe para filtrar..."/></Field>
          <div style={{marginBottom:14,maxHeight:210,overflowY:"auto",border:`1px solid ${G.cardBorder}`,borderRadius:10}}>
            {filteredPending.length===0?<div style={{padding:"12px 14px",color:G.textMuted,fontSize:13}}>Sin ventas pendientes.</div>:filteredPending.map(s=>(
              <div key={s.id} onClick={()=>setForm(f=>({...f,saleId:s.id}))} style={{padding:"10px 14px",cursor:"pointer",borderBottom:`1px solid ${G.cardBorder}`,background:form.saleId===s.id?"rgba(201,168,76,.15)":"transparent",borderLeft:form.saleId===s.id?`3px solid ${G.gold}`:"3px solid transparent",transition:"all .15s"}}>
                <div style={{fontWeight:500,fontSize:13}}>{s.client?.name||"—"}</div>
                <div style={{fontSize:12,color:G.textMuted}}>🌸 {s.perfume}{s.client?.ci&&<span style={{marginLeft:6}}>· 🪪 {s.client.ci}</span>}
                  {(()=>{const inv=inventory?.find(p=>p.id===s.inventoryId);const sup=inv&&suppliers?.find(x=>x.id===inv.supplierId);return sup?<span style={{color:G.blue,marginLeft:6}}>· 🏪 {sup.name}</span>:null;})()}
                  <span style={{marginLeft:6,color:G.red,fontWeight:600}}>· Resta: {fmt$(s.remaining)}</span>
                </div>
              </div>
            ))}
          </div>
          <Field label="Monto del Abono $ *"><input type="number" onWheel={e=>e.target.blur()} value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} placeholder="0.00"/></Field>
          <Field label="Fecha"><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
          <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={2} placeholder="Ej. Transferencia Banesco..."/></Field>
          <Field label="📎 Comprobante (foto)">
            <input ref={fileRef} type="file" accept="image/*" onChange={handleImage} style={{display:"none"}}/>
            <div style={{display:"flex",gap:10,alignItems:"center"}}><Btn variant="ghost" onClick={()=>fileRef.current.click()}>📷 Subir imagen</Btn>{imgPreview&&<img src={imgPreview} alt="preview" style={{width:50,height:50,objectFit:"cover",borderRadius:6}}/>}</div>
          </Field>
          <Btn onClick={save} disabled={!form.saleId||!form.amount} style={{width:"100%"}}>{!form.saleId?"Selecciona una venta arriba":"Guardar Abono"}</Btn>
        </Modal>
      )}
    </div>
  );
}

// ─── INVENTARIO ────────────────────────────────────────────────────────────────
function Inventario({inventory,setInventory,suppliers,restocks,setRestocks}){
  const emptyForm={name:"",brand:"",size:"",costPrice:"",salePrice:"",stock:"0",minStock:"2",supplierId:"",notes:""};

  const[modal,setModal]=useState(false);
  const[editModal,setEditModal]=useState(false);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(emptyForm);
  const[search,setSearch]=useState("");
  const[confirmDel,setConfirmDel]=useState(null);
  const[mergeModal,setMergeModal]=useState(null);
  const[historyModal,setHistoryModal]=useState(null);

  // ── Producto CRUD ──
  const save=async()=>{
    if(!form.name.trim())return;
    const updated=[...inventory,{...form,id:uid(),createdAt:today()}];
    setInventory(updated);await saveData("inventory",updated);setForm(emptyForm);setModal(false);
  };
  const saveEdit=async()=>{
    if(!form.name.trim())return;
    const updated=inventory.map(p=>p.id===editId?{...p,...form}:p);
    setInventory(updated);await saveData("inventory",updated);setEditModal(false);setEditId(null);setForm(emptyForm);
  };
  const doDelete=async()=>{
    const updated=inventory.filter(p=>p.id!==confirmDel);
    setInventory(updated);await saveData("inventory",updated);setConfirmDel(null);
  };
  const openEdit=(p,e)=>{e.stopPropagation();setEditId(p.id);setForm({name:p.name,brand:p.brand||"",size:p.size||"",costPrice:p.costPrice||"",salePrice:p.salePrice||"",stock:p.stock||"",minStock:p.minStock||"2",supplierId:p.supplierId||"",notes:p.notes||""});setEditModal(true);};

  const adjustStock=async(item,delta)=>{
    const newStock=Math.max(0,(parseInt(item.stock)||0)+delta);
    const updated=inventory.map(p=>p.id===item.id?{...p,stock:newStock}:p);
    setInventory(updated);await saveData("inventory",updated);
  };
  const saveStockDirect=async(item,val)=>{
    const newStock=Math.max(0,parseInt(val)||0);
    const updated=inventory.map(p=>p.id===item.id?{...p,stock:newStock}:p);
    setInventory(updated);await saveData("inventory",updated);
  };

  // ── Fusión de duplicados ──
  const doMerge=async()=>{
    if(!mergeModal)return;
    const{keepId,discardId}=mergeModal;
    const keep=inventory.find(p=>p.id===keepId);
    const discard=inventory.find(p=>p.id===discardId);
    if(!keep||!discard)return;
    // Sumar stocks
    const mergedStock=(parseInt(keep.stock)||0)+(parseInt(discard.stock)||0);
    // Reasignar restocks del descartado al que se mantiene
    const updatedRestocks=restocks.map(r=>r.inventoryId===discardId?{...r,inventoryId:keepId}:r);
    // Eliminar el duplicado y actualizar el que se mantiene
    const updatedInv=inventory.filter(p=>p.id!==discardId).map(p=>p.id===keepId?{...p,stock:mergedStock}:p);
    setInventory(updatedInv);await saveData("inventory",updatedInv);
    setRestocks(updatedRestocks);await saveData("restocks",updatedRestocks);
    setMergeModal(null);
  };

  // Detectar duplicados (mismo nombre+marca+tamaño, ignorando mayúsculas)
  const normKey=p=>`${p.name.trim().toLowerCase()}|${(p.brand||"").trim().toLowerCase()}|${(p.size||"").trim().toLowerCase()}`;
  const dupGroups=Object.values(inventory.reduce((acc,p)=>{const k=normKey(p);if(!acc[k])acc[k]=[];acc[k].push(p);return acc;},{})).filter(g=>g.length>1);

  // ── Cálculos globales ──
  const filtered=inventory.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||(p.brand&&p.brand.toLowerCase().includes(search.toLowerCase())));
  const lowStock=inventory.filter(p=>(parseInt(p.stock)||0)<=(p.minStock!==''&&p.minStock!=null?parseInt(p.minStock):2));
  const lowStockCount=lowStock.length;
  const totalStockValue=inventory.reduce((a,p)=>{const s=parseInt(p.stock)||0;const c=parseFloat(p.costPrice||0);return a+s*c;},0);
  const totalSaleValue=inventory.reduce((a,p)=>{const s=parseInt(p.stock)||0;const sp=parseFloat(p.salePrice||0);return a+s*sp;},0);
  const withMargin=inventory.filter(p=>p.costPrice&&p.salePrice&&parseFloat(p.costPrice)>0);
  const avgMarginPct=withMargin.length?withMargin.reduce((a,p)=>{const m=(parseFloat(p.salePrice)-parseFloat(p.costPrice))/parseFloat(p.costPrice)*100;return a+m;},0)/withMargin.length:0;
  const totalUnits=inventory.reduce((a,p)=>(parseInt(p.stock)||0)+a,0);

  // ── Campos para NUEVO producto (solo catálogo, sin stock/costo/proveedor) ──
  const InvFields=()=>(
    <>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Nombre del Perfume *"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ej. Chanel No.5" autoFocus/></Field>
        <Field label="Marca"><input value={form.brand} onChange={e=>setForm(f=>({...f,brand:e.target.value}))} placeholder="Ej. Chanel"/></Field>
      </div>
      <Field label="Tamaño / Presentación"><input value={form.size} onChange={e=>setForm(f=>({...f,size:e.target.value}))} placeholder="Ej. 100ml, 50ml, 3.4 EDT M"/></Field>
      <Field label="Precio de Venta $"><input type="number" onWheel={e=>e.target.blur()} value={form.salePrice} onChange={e=>setForm(f=>({...f,salePrice:e.target.value}))} placeholder="0.00"/></Field>
      <Field label="Stock mínimo de alerta"><input type="number" onWheel={e=>e.target.blur()} value={form.minStock} onChange={e=>setForm(f=>({...f,minStock:e.target.value}))} placeholder="2"/></Field>
      <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
      <div style={{fontSize:12,color:G.textMuted,padding:"8px 10px",background:"rgba(255,255,255,.03)",borderRadius:8}}>
        ⓘ El stock, precio de compra y proveedor se registran al <strong>Reabastecer</strong> por primera vez.
      </div>
    </>
  );

  // ── Campos para EDITAR producto (todos los campos) ──
  const EditInvFields=()=>(
    <>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Nombre del Perfume *"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ej. Chanel No.5"/></Field>
        <Field label="Marca"><input value={form.brand} onChange={e=>setForm(f=>({...f,brand:e.target.value}))} placeholder="Ej. Chanel"/></Field>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Tamaño / Presentación"><input value={form.size} onChange={e=>setForm(f=>({...f,size:e.target.value}))} placeholder="Ej. 100ml"/></Field>
        <Field label="Precio de Venta $"><input type="number" onWheel={e=>e.target.blur()} value={form.salePrice} onChange={e=>setForm(f=>({...f,salePrice:e.target.value}))} placeholder="0.00"/></Field>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Precio de compra $ (referencia)"><input type="number" onWheel={e=>e.target.blur()} value={form.costPrice} onChange={e=>setForm(f=>({...f,costPrice:e.target.value}))} placeholder="0.00"/></Field>
        <Field label="Stock mínimo de alerta"><input type="number" onWheel={e=>e.target.blur()} value={form.minStock} onChange={e=>setForm(f=>({...f,minStock:e.target.value}))} placeholder="2"/></Field>
      </div>
      <Field label="🏪 Proveedor principal">
        <select value={form.supplierId} onChange={e=>setForm(f=>({...f,supplierId:e.target.value}))}>
          <option value="">— Sin proveedor —</option>
          {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}{s.phone?` · ${s.phone}`:""}</option>)}
        </select>
      </Field>
      <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
    </>
  );


  return(
    <div className="fade-in">
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:28,color:G.goldLight}}>Inventario</div>
          <div style={{color:G.textMuted,fontSize:13}}>{inventory.length} producto(s) · {totalUnits} unidades en total{lowStockCount>0&&<span style={{color:G.red}}> · ⚠ {lowStockCount} con stock bajo</span>}</div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn onClick={()=>{setForm(emptyForm);setModal(true);}}>+ Nuevo Producto</Btn>
        </div>
      </div>

      {/* Stats cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:20}}>
        <Card style={{padding:"14px 16px"}}>
          <div style={{fontSize:11,color:G.textMuted,marginBottom:4}}>💰 Capital en stock</div>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:G.red,fontWeight:600}}>{fmt$(totalStockValue)}</div>
          <div style={{fontSize:11,color:G.textMuted,marginTop:2}}>precio de compra</div>
        </Card>
        <Card style={{padding:"14px 16px"}}>
          <div style={{fontSize:11,color:G.textMuted,marginBottom:4}}>📈 Valor potencial</div>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:G.green,fontWeight:600}}>{fmt$(totalSaleValue)}</div>
          <div style={{fontSize:11,color:G.textMuted,marginTop:2}}>si vendes todo</div>
        </Card>
        <Card style={{padding:"14px 16px"}}>
          <div style={{fontSize:11,color:G.textMuted,marginBottom:4}}>✨ Ganancia potencial</div>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:G.gold,fontWeight:600}}>{fmt$(totalSaleValue-totalStockValue)}</div>
          <div style={{fontSize:11,color:G.textMuted,marginTop:2}}>al vender todo</div>
        </Card>
        <Card style={{padding:"14px 16px"}}>
          <div style={{fontSize:11,color:G.textMuted,marginBottom:4}}>📊 Margen promedio</div>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:avgMarginPct>=0?G.goldLight:G.red,fontWeight:600}}>{avgMarginPct.toFixed(1)}%</div>
          <div style={{fontSize:11,color:G.textMuted,marginTop:2}}>{withMargin.length} producto(s)</div>
        </Card>
      </div>

      <input placeholder="🔍 Buscar por nombre o marca..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:16}}/>

      {/* Banner de duplicados detectados */}
      {dupGroups.length>0&&(
        <div style={{marginBottom:16,padding:"12px 16px",background:"rgba(201,168,76,.07)",border:"1px solid rgba(201,168,76,.35)",borderRadius:10}}>
          <div style={{fontWeight:600,color:G.goldLight,fontSize:13,marginBottom:10}}>⚠️ Se detectaron productos duplicados — mismo nombre, diferente entrada</div>
          {dupGroups.map((group,gi)=>(
            <div key={gi} style={{marginBottom:gi<dupGroups.length-1?12:0}}>
              <div style={{fontSize:12,color:G.textMuted,marginBottom:6}}>
                <strong style={{color:G.text}}>{group[0].name}{group[0].brand?" · "+group[0].brand:""}{group[0].size?" "+group[0].size:""}</strong> — {group.length} entradas separadas
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                {group.map((p,i)=>{
                  const sup=suppliers.find(s=>s.id===p.supplierId);
                  return(
                    <div key={p.id} style={{background:"rgba(255,255,255,.05)",borderRadius:8,padding:"6px 12px",fontSize:12,border:`1px solid ${G.cardBorder}`}}>
                      <span style={{color:G.textMuted}}>Stock: </span><strong>{parseInt(p.stock)||0}</strong>
                      {sup&&<span style={{color:G.blue,marginLeft:8}}>🏪 {sup.name}</span>}
                    </div>
                  );
                })}
                <Btn size="sm" variant="ghost" onClick={()=>setMergeModal({group})}>🔀 Fusionar</Btn>
              </div>
            </div>
          ))}
        </div>
      )}

      {lowStockCount>0&&(
        <div style={{marginBottom:16,padding:"10px 14px",background:"rgba(224,92,92,.08)",border:"1px solid rgba(224,92,92,.3)",borderRadius:10,fontSize:13}}>
          ⚠️ <strong style={{color:G.red}}>Stock bajo:</strong> {lowStock.map(p=>p.name).join(", ")}
        </div>
      )}

      {/* Tarjetas de productos */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:12,maxHeight:680,overflowY:"auto",paddingRight:4}}>
        {filtered.map(p=>{
          const stock=parseInt(p.stock)||0;
          const minS=p.minStock!==''&&p.minStock!=null?parseInt(p.minStock):2;
          const isLow=stock<=minS;
          const costP=parseFloat(p.costPrice||0);
          const saleP=parseFloat(p.salePrice||0);
          const margin=p.costPrice&&p.salePrice?saleP-costP:null;
          const marginPct=margin!==null&&costP>0?((saleP-costP)/costP*100):null;
          const supplier=suppliers.find(s=>s.id===p.supplierId);
          const pRestocks=restocks.filter(r=>r.inventoryId===p.id);
          return(
            <Card key={p.id} style={{borderColor:isLow?"rgba(224,92,92,.4)":G.cardBorder}}>
              {/* Nombre + botones */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:15}}>{p.name}</div>
                  {p.brand&&<div style={{fontSize:12,color:G.textMuted}}>{p.brand}{p.size&&` · ${p.size}`}</div>}
                  {supplier&&<div style={{fontSize:11,color:G.blue,marginTop:2}}>🏪 {supplier.name}</div>}
                </div>
                <div style={{display:"flex",gap:4,flexShrink:0,marginLeft:6}}>
                  <Btn variant="edit" size="sm" onClick={e=>openEdit(p,e)}>✏️</Btn>
                  <Btn variant="danger" size="sm" onClick={e=>{e.stopPropagation();setConfirmDel(p.id);}}>🗑️</Btn>
                </div>
              </div>
              <div className="gold-line"/>

              {/* Precios + márgenes */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,marginBottom:10,textAlign:"center"}}>
                <div>
                  <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Compra</div>
                  <div style={{fontWeight:600,fontSize:13,color:G.textMuted}}>{p.costPrice?fmt$(p.costPrice):"—"}</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Venta</div>
                  <div style={{fontWeight:600,fontSize:13,color:G.gold}}>{p.salePrice?fmt$(p.salePrice):"—"}</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Ganancia</div>
                  {margin!==null
                    ?<div style={{fontWeight:700,fontSize:13,color:margin>=0?G.green:G.red}}>
                        {fmt$(margin)}{marginPct!==null&&<span style={{fontSize:10,marginLeft:3,opacity:.85}}>({marginPct.toFixed(0)}%)</span>}
                      </div>
                    :<div style={{fontSize:13,color:G.textMuted}}>—</div>}
                </div>
              </div>

              {/* Stock — solo lectura, sin botones */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.04)",borderRadius:8,padding:"10px 12px",marginBottom:10,gap:10}}>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:10,color:G.textMuted,marginBottom:2}}>Stock actual</div>
                  <div style={{fontWeight:700,fontSize:26,color:isLow?G.red:G.text,lineHeight:1}}>{stock}</div>
                  {isLow&&<div style={{fontSize:10,color:G.red,marginTop:2}}>⚠ stock bajo</div>}
                </div>
              </div>

              {p.notes&&<div style={{fontSize:11,color:G.textMuted,marginBottom:8,lineHeight:1.4}}>{p.notes}</div>}

              {/* Botón historial */}
              <Btn variant="ghost" size="sm" style={{width:"100%",position:"relative"}} onClick={()=>setHistoryModal(p)}>
                📋 Historial de entradas
                {pRestocks.length>0&&<span style={{position:"absolute",top:-5,right:-5,background:G.gold,color:"#0d0d0f",borderRadius:"50%",width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>{pRestocks.length}</span>}
              </Btn>
            </Card>
          );
        })}
        {filtered.length===0&&<p style={{color:G.textMuted,fontSize:13}}>Sin productos que coincidan.</p>}
      </div>

      {/* ── Modals ── */}
      {modal&&(
        <Modal title="Nuevo Producto" onClose={()=>setModal(false)} wide>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Nombre del Perfume *"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ej. Chanel No.5"/></Field>
            <Field label="Marca"><input value={form.brand} onChange={e=>setForm(f=>({...f,brand:e.target.value}))} placeholder="Ej. Chanel"/></Field>
          </div>
          <Field label="Tamaño / Presentación"><input value={form.size} onChange={e=>setForm(f=>({...f,size:e.target.value}))} placeholder="Ej. 100ml, 50ml, 3.4 EDT M"/></Field>
          <Field label="Precio de Venta $"><input type="number" onWheel={e=>e.target.blur()} value={form.salePrice} onChange={e=>setForm(f=>({...f,salePrice:e.target.value}))} placeholder="0.00"/></Field>
          <Field label="Stock mínimo de alerta"><input type="number" onWheel={e=>e.target.blur()} value={form.minStock} onChange={e=>setForm(f=>({...f,minStock:e.target.value}))} placeholder="2"/></Field>
          <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
          <div style={{fontSize:12,color:G.textMuted,padding:"8px 10px",background:"rgba(255,255,255,.03)",borderRadius:8}}>
            ⓘ El stock, precio de compra y proveedor se registran al <strong>Reabastecer</strong> por primera vez.
          </div>
          <Btn onClick={save} style={{width:"100%"}}>Guardar Producto</Btn>
        </Modal>
      )}
      {editModal&&(
        <Modal title="Editar Producto" onClose={()=>{setEditModal(false);setEditId(null);}} wide>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Nombre del Perfume *"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ej. Chanel No.5"/></Field>
            <Field label="Marca"><input value={form.brand} onChange={e=>setForm(f=>({...f,brand:e.target.value}))} placeholder="Ej. Chanel"/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Tamaño / Presentación"><input value={form.size} onChange={e=>setForm(f=>({...f,size:e.target.value}))} placeholder="Ej. 100ml"/></Field>
            <Field label="Precio de Venta $"><input type="number" onWheel={e=>e.target.blur()} value={form.salePrice} onChange={e=>setForm(f=>({...f,salePrice:e.target.value}))} placeholder="0.00"/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Precio de compra $ (referencia)"><input type="number" onWheel={e=>e.target.blur()} value={form.costPrice} onChange={e=>setForm(f=>({...f,costPrice:e.target.value}))} placeholder="0.00"/></Field>
            <Field label="Stock mínimo de alerta"><input type="number" onWheel={e=>e.target.blur()} value={form.minStock} onChange={e=>setForm(f=>({...f,minStock:e.target.value}))} placeholder="2"/></Field>
          </div>
          <Field label="🏪 Proveedor principal">
            <select value={form.supplierId} onChange={e=>setForm(f=>({...f,supplierId:e.target.value}))}>
              <option value="">— Sin proveedor —</option>
              {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}{s.phone?` · ${s.phone}`:""}</option>)}
            </select>
          </Field>
          <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} placeholder="Info adicional..."/></Field>
          <Btn onClick={saveEdit} style={{width:"100%"}}>Guardar Cambios</Btn>
        </Modal>
      )}
      {confirmDel&&<ConfirmModal message="¿Eliminar este producto?" subtext="El producto será eliminado del inventario." onConfirm={doDelete} onCancel={()=>setConfirmDel(null)}/>}

      {/* Modal Fusionar duplicados */}
      {mergeModal&&<MergeModal group={mergeModal.group} inventory={inventory} setInventory={setInventory} restocks={restocks} setRestocks={setRestocks} suppliers={suppliers} onClose={()=>setMergeModal(null)}/>}
      {historyModal&&(()=>{
        const pRestocks=[...restocks.filter(r=>r.inventoryId===historyModal.id)].sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date));
        const totalUnitsIn=pRestocks.reduce((a,r)=>a+(parseInt(r.qty)||0),0);
        const totalSpent=pRestocks.reduce((a,r)=>a+parseFloat(r.totalPaid||0),0);
        return(
          <Modal title={`📋 Historial: ${historyModal.name}`} onClose={()=>setHistoryModal(null)} wide>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
              <div style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:10,color:G.textMuted}}>Entradas registradas</div>
                <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:G.goldLight,fontWeight:600}}>{pRestocks.length}</div>
              </div>
              <div style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:10,color:G.textMuted}}>Unidades ingresadas</div>
                <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:G.green,fontWeight:600}}>{totalUnitsIn}</div>
              </div>
              <div style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:10,color:G.textMuted}}>Total invertido</div>
                <div style={{fontFamily:"Cormorant Garamond",fontSize:24,color:G.red,fontWeight:600}}>{fmt$(totalSpent)}</div>
              </div>
            </div>
            {pRestocks.length===0
              ?<p style={{color:G.textMuted,fontSize:13,textAlign:"center",padding:20}}>No hay reabastecimientos registrados para este producto.</p>
              :<div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:400,overflowY:"auto"}}>
                {pRestocks.map((r,i)=>{
                  const sup=suppliers.find(s=>s.id===r.supplierId);
                  return(
                    <div key={r.id} style={{background:"rgba(255,255,255,.03)",borderRadius:10,padding:"12px 14px",border:`1px solid ${G.cardBorder}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div>
                          <div style={{fontWeight:600,fontSize:14,color:G.green}}>+{r.qty} unidades</div>
                          {r.orderId&&<div style={{fontSize:11,color:G.gold,marginTop:2}}>🛒 Pedido #{r.orderId.slice(-6).toUpperCase()}</div>}
                          {sup&&<div style={{fontSize:12,color:G.blue,marginTop:2}}>🏪 {sup.name}</div>}
                          <div style={{fontSize:12,color:G.textMuted,marginTop:2}}>📅 {fmtDate(r.date)}</div>
                          {r.notes&&<div style={{fontSize:12,color:G.textMuted,marginTop:2}}>📝 {r.notes}</div>}
                        </div>
                        <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                          {r.costPrice&&<div style={{fontSize:12,color:G.textMuted}}>{fmt$(r.costPrice)}/u{r.extraCostPerUnit>0&&<span style={{color:G.gold}}> +{fmt$(r.extraCostPerUnit)} extra</span>}</div>}
                          {r.costPriceWithExtra&&r.extraCostPerUnit>0&&<div style={{fontSize:11,color:G.gold}}>={fmt$(r.costPriceWithExtra)}/u final</div>}
                          {parseFloat(r.totalPaid||0)>0&&<div style={{fontWeight:700,color:G.gold,fontSize:15}}>{fmt$(r.totalPaid)}</div>}
                        </div>
                      </div>
                      {/* Adjuntos */}
                      {r.attachments&&r.attachments.length>0&&(
                        <div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${G.cardBorder}`}}>
                          <div style={{fontSize:11,color:G.textMuted,marginBottom:6}}>📎 Comprobantes ({r.attachments.length})</div>
                          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                            {r.attachments.map((a,ai)=>(
                              a.url
                              ?<a key={ai} href={a.url} target="_blank" rel="noopener noreferrer" style={{height:40,padding:"0 10px",display:"flex",alignItems:"center",gap:5,background:"rgba(201,168,76,.08)",borderRadius:6,border:`1px solid ${G.cardBorder}`,fontSize:11,color:G.gold,textDecoration:"none"}}>📎 {a.name}</a>
                              :a.dataUrl&&(a.type||"").startsWith("image/")
                              ?<img key={ai} src={a.dataUrl} alt={a.name} onClick={()=>downloadReceipt(a.dataUrl,a.name)} style={{height:52,width:52,objectFit:"cover",borderRadius:6,cursor:"pointer",border:`1px solid ${G.cardBorder}`}} title={a.name}/>
                              :<div key={ai} onClick={()=>a.dataUrl&&downloadReceipt(a.dataUrl,a.name)} style={{height:52,width:52,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.05)",border:`1px solid ${G.cardBorder}`,borderRadius:6,cursor:"pointer",fontSize:10,color:G.textMuted,gap:1}}>
                                  <span style={{fontSize:20}}>📄</span><span>PDF</span>
                                </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            }
          </Modal>
        );
      })()}
      {/* Modal Fusionar duplicados */}
      {mergeModal&&<MergeModal group={mergeModal.group} inventory={inventory} setInventory={setInventory} restocks={restocks} setRestocks={setRestocks} suppliers={suppliers} onClose={()=>setMergeModal(null)}/>}

    </div>
  );
}

function MergeModal({group,inventory,setInventory,restocks,setRestocks,suppliers,onClose}){
  const[keepId,setKeepId]=useState(group[0].id);
  const totalStock=group.reduce((a,p)=>(parseInt(p.stock)||0)+a,0);
  const totalR=group.reduce((a,p)=>a+restocks.filter(r=>r.inventoryId===p.id).length,0);
  const doMerge=async()=>{
    const discardIds=group.filter(p=>p.id!==keepId).map(p=>p.id);
    const updatedRestocks=restocks.map(r=>discardIds.includes(r.inventoryId)?{...r,inventoryId:keepId}:r);
    const updatedInv=inventory.filter(p=>!discardIds.includes(p.id)).map(p=>p.id===keepId?{...p,stock:totalStock}:p);
    setInventory(updatedInv);await saveData("inventory",updatedInv);
    setRestocks(updatedRestocks);await saveData("restocks",updatedRestocks);
    onClose();
  };
  return(
    <Modal title="🔀 Fusionar productos duplicados" onClose={onClose} wide>
      <div style={{background:"rgba(201,168,76,.06)",border:"1px solid rgba(201,168,76,.2)",borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:13}}>
        <div style={{marginBottom:6,color:G.textMuted,fontWeight:600}}>La fusión hará lo siguiente:</div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <div>✅ Sumará todos los stocks → <strong style={{color:G.green}}>{totalStock} unidades</strong> en un solo producto</div>
          <div>✅ Combinará los historiales de reabastecimiento → <strong style={{color:G.blue}}>{totalR} entrada(s)</strong></div>
          <div>✅ Eliminará las entradas duplicadas del inventario</div>
          <div style={{color:G.red,marginTop:4}}>⚠ Esta acción no se puede deshacer</div>
        </div>
      </div>
      <Field label="¿Cuál entrada quieres conservar? (sus datos quedarán como el producto final)">
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:4}}>
          {group.map(p=>{
            const sup=suppliers.find(s=>s.id===p.supplierId);
            const pR=restocks.filter(r=>r.inventoryId===p.id);
            return(
              <label key={p.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",borderRadius:10,border:`2px solid ${keepId===p.id?G.gold:G.cardBorder}`,cursor:"pointer",background:keepId===p.id?"rgba(201,168,76,.07)":"rgba(255,255,255,.02)",transition:"all .2s"}}>
                <input type="radio" name="keepId" value={p.id} checked={keepId===p.id} onChange={()=>setKeepId(p.id)} style={{marginTop:3}}/>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{p.name}{p.brand?" · "+p.brand:""}{p.size?" "+p.size:""}</div>
                  <div style={{fontSize:12,color:G.textMuted,marginTop:3,display:"flex",gap:14,flexWrap:"wrap"}}>
                    <span>Stock: <strong style={{color:G.text}}>{parseInt(p.stock)||0}</strong></span>
                    {p.costPrice&&<span>Compra: <strong style={{color:G.text}}>{fmt$(p.costPrice)}</strong></span>}
                    {p.salePrice&&<span>Venta: <strong style={{color:G.gold}}>{fmt$(p.salePrice)}</strong></span>}
                    {sup&&<span style={{color:G.blue}}>🏪 {sup.name}</span>}
                    <span>Historial: <strong style={{color:G.blue}}>{pR.length} entrada(s)</strong></span>
                  </div>
                </div>
              </label>
            );
          })}
        </div>
      </Field>
      <Btn onClick={doMerge} style={{width:"100%",marginTop:8}}>✅ Confirmar fusión</Btn>
    </Modal>
  );
}

// ─── PEDIDOS ──────────────────────────────────────────────────────────────────
function Pedidos({inventory,setInventory,suppliers,setSuppliers,restocks,setRestocks}){
  const[newModal,setNewModal]=useState(false);
  const[detailModal,setDetailModal]=useState(null);
  const[editModal,setEditModal]=useState(null);
  const[search,setSearch]=useState("");
  const[deleteConfirm1,setDeleteConfirm1]=useState(null); // first confirm
  const[deleteConfirm2,setDeleteConfirm2]=useState(null); // second confirm
  // Proveedores
  const emptySupForm={name:"",phone:"",email:"",address:"",notes:""};
  const[supSection,setSupSection]=useState(false);
  const[supModal,setSupModal]=useState(false);
  const[supEditModal,setSupEditModal]=useState(false);
  const[supEditId,setSupEditId]=useState(null);
  const[supForm,setSupForm]=useState(emptySupForm);
  const[supConfirmDel,setSupConfirmDel]=useState(null);
  const saveSup=async()=>{if(!supForm.name.trim())return;const updated=[...suppliers,{...supForm,id:uid(),createdAt:today()}];setSuppliers(updated);await saveData("suppliers",updated);setSupForm(emptySupForm);setSupModal(false);};
  const saveEditSup=async()=>{if(!supForm.name.trim())return;const updated=suppliers.map(s=>s.id===supEditId?{...s,...supForm}:s);setSuppliers(updated);await saveData("suppliers",updated);setSupEditModal(false);setSupEditId(null);setSupForm(emptySupForm);};
  const doDeleteSup=async()=>{const updated=suppliers.filter(s=>s.id!==supConfirmDel);setSuppliers(updated);await saveData("suppliers",updated);setSupConfirmDel(null);};
  const openEditSup=(s,e)=>{e.stopPropagation();setSupEditId(s.id);setSupForm({name:s.name,phone:s.phone||"",email:s.email||"",address:s.address||"",notes:s.notes||""});setSupEditModal(true);};

  // Agrupar restocks por orderId
  const orders=useMemo(()=>{
    const byOrder={};
    restocks.forEach(r=>{
      const oid=r.orderId||r.id;
      if(!byOrder[oid]){
        byOrder[oid]={orderId:oid,date:r.date,supplierId:r.supplierId||"",notes:r.notes||"",attachments:[],shippingCost:r.shippingCost||"",marketingCost:r.marketingCost||"",items:[],createdAt:r.createdAt||r.date};
      }
      // Recoger adjuntos de cualquier línea que los tenga (están en la primera)
      if(r.attachments&&r.attachments.length>0&&byOrder[oid].attachments.length===0){
        byOrder[oid].attachments=r.attachments;
      }
      byOrder[oid].items.push(r);
    });
    return Object.values(byOrder).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  },[restocks]);

  const filteredOrders=orders.filter(o=>{
    const q=search.toLowerCase();
    if(!q)return true;
    const sup=suppliers.find(s=>s.id===o.supplierId);
    const idMatch=o.orderId.slice(-6).toLowerCase().includes(q);
    const supMatch=sup&&sup.name.toLowerCase().includes(q);
    const dateMatch=fmtDate(o.date).toLowerCase().includes(q);
    const noteMatch=o.notes&&o.notes.toLowerCase().includes(q);
    const prodMatch=o.items.some(r=>{const p=inventory.find(x=>x.id===r.inventoryId);return p&&(p.name.toLowerCase().includes(q)||( p.brand&&p.brand.toLowerCase().includes(q)));});
    return idMatch||supMatch||dateMatch||noteMatch||prodMatch;
  });

  const totalInvested=orders.reduce((a,o)=>a+o.items.reduce((b,r)=>b+(parseFloat(r.costPrice||0)*(parseInt(r.qty)||0)),0)+parseFloat(o.shippingCost||0)+parseFloat(o.marketingCost||0),0);
  const totalUnits=orders.reduce((a,o)=>a+o.items.reduce((b,r)=>b+(parseInt(r.qty)||0),0),0);

  const saveEdit=async(order,edited)=>{
    const updated=restocks.map(r=>(r.orderId||r.id)===order.orderId?{...r,...edited}:r);
    setRestocks(updated);await saveData("restocks",updated);
    setEditModal(null);
  };

  // Eliminar pedido: revierte el stock de todos los productos
  const doDeleteOrder=async(order)=>{
    // Revertir stock
    let updatedInv=[...inventory];
    order.items.forEach(r=>{
      const qty=parseInt(r.qty)||0;
      updatedInv=updatedInv.map(p=>p.id===r.inventoryId?{...p,stock:Math.max(0,(parseInt(p.stock)||0)-qty)}:p);
    });
    const updatedR=restocks.filter(r=>(r.orderId||r.id)!==order.orderId);
    setInventory(updatedInv);await saveData("inventory",updatedInv);
    setRestocks(updatedR);await saveData("restocks",updatedR);
    setDeleteConfirm2(null);setDeleteConfirm1(null);
  };

  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontFamily:"Cormorant Garamond",fontSize:28,color:G.goldLight}}>🛒 Pedidos</div>
          <div style={{color:G.textMuted,fontSize:13}}>{orders.length} pedido(s) · {totalUnits} unidades ingresadas en total</div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn variant="ghost" onClick={()=>setSupSection(v=>!v)}>🏪 Proveedores ({suppliers.length})</Btn>
          <Btn variant="success" onClick={()=>setNewModal(true)}>📦 Nuevo Pedido</Btn>
        </div>
      </div>

      {/* Panel Proveedores */}
      {supSection&&(
        <div style={{marginBottom:20,padding:"14px 16px",background:"rgba(255,255,255,.02)",border:`1px solid ${G.cardBorder}`,borderRadius:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
